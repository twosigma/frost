repos:
  # Python - Ruff linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Python - Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        # Match the simulator/test environment; a floating cocotb here can
        # expose different typing APIs from the version exercised by CI.
        additional_dependencies: [pytest, cocotb==2.1.0]
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        entry: mypy verif tests

  # C/C++ - clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.6
    hooks:
      - id: clang-format
        types_or: [c, c++]
        # env_v/: the riscv-tests virtual-memory environment adapted from
        # upstream (its own license and form), like riscv_test.h.
        # linux/frost-net10g/: a Linux driver in the kernel's coding style
        # (scripts/checkpatch.pl) and the kernel's license, GPL-2.0-only OR
        # BSD-2-Clause; the insert-license hooks below skip it too.
        exclude: |
          (?x)^(
            sw/FreeRTOS-Kernel/.*|
            sw/apps/coremark/coremark/.*|
            sw/apps/riscv_tests/riscv_test\.h|
            sw/apps/riscv_tests/env_v/.*|
            linux/frost-net10g/.*
          )$

  # C/C++ - clang-tidy via a wrapper script that sets the RISC-V target and
  # include paths. Compiler diagnostics are errors; the broader .clang-tidy
  # checks are reported as advisory counts until the repository has a clean
  # baseline.
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: python3 ./scripts/run-clang-tidy.py
        language: system
        verbose: true
        types_or: [c, c++]
        # The buildroot package sources are Linux-userspace programs; the
        # wrapper compiles against the bare-metal RISC-V include paths, where
        # Linux headers (sys/mman.h etc.) do not exist. linux/frost-net10g/
        # is kernel code, which needs a kernel tree's headers. pgo_dump.c
        # includes GCC's own gcov.h and walks the __gcov_info_* symbols the
        # compiler emits, none of which clang resolves.
        exclude: |
          (?x)^(
            sw/FreeRTOS-Kernel/.*|
            sw/apps/coremark/coremark/.*|
            sw/apps/coremark/iss/pgo_dump\.c|
            sw/apps/riscv_tests/riscv_test\.h|
            sw/apps/riscv_tests/env_v/.*|
            linux/buildroot-external/package/.*/src/.*|
            linux/frost-net10g/.*
          )$

  # SystemVerilog/Verilog - Verible formatter and linter
  - repo: local
    hooks:
      - id: verible-format
        name: verible-verilog-format
        entry: verible-verilog-format
        language: system
        files: \.(sv|v|svh|vh)$
        args: [--inplace]
        exclude: |
          (?x)^(
            hw/third_party/.*
          )$

      - id: verible-lint
        name: verible-verilog-lint
        entry: verible-verilog-lint
        language: system
        files: \.(sv|v|svh|vh)$
        args: [--rules_config_search]
        exclude: |
          (?x)^(
            hw/third_party/.*
          )$

  # Copyright header check/insert
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: insert-license (Python)
        files: \.py$
        exclude: |
          (?x)^(
            sw/FreeRTOS-Kernel/.*|
            sw/apps/coremark/coremark/.*
          )$
        args:
          - --license-filepath=.license-header.txt
          - --comment-style=#

      - id: insert-license
        name: insert-license (C/C++)
        files: \.(c|h|cpp|hpp)$
        exclude: |
          (?x)^(
            sw/FreeRTOS-Kernel/.*|
            sw/apps/coremark/coremark/.*|
            sw/apps/riscv_tests/riscv_test\.h|
            sw/apps/riscv_tests/env_v/.*|
            linux/frost-net10g/.*
          )$
        args:
          - --license-filepath=.license-header.txt
          - --comment-style=/*| *| */

      - id: insert-license
        name: insert-license (SystemVerilog)
        files: \.(sv|svh|v|vh)$
        exclude: |
          (?x)^(
            hw/third_party/.*
          )$
        args:
          - --license-filepath=.license-header.txt
          - --comment-style=/*| *| */

      - id: insert-license
        name: insert-license (Tcl/Makefile/Shell)
        files: (\.tcl$|Makefile$|\.mk$|\.sh$)
        exclude: ^linux/frost-net10g/
        args:
          - --license-filepath=.license-header.txt
          - --comment-style=#

  # General file checks. tests/fixtures/*.log are captures kept byte for byte --
  # a board's UART console, carriage returns, terminal escapes, the trailing
  # space of a shell prompt and all -- because the parsers under test are
  # measured against what a board really sends. Both fixers would rewrite those
  # bytes, so the captures are exempt; the reports and other fixtures are not.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            sw/FreeRTOS-Kernel/.*|
            sw/apps/coremark/coremark/.*|
            tests/fixtures/.*\.log
          )$
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            sw/FreeRTOS-Kernel/.*|
            sw/apps/coremark/coremark/.*|
            tests/fixtures/.*\.log
          )$
      - id: check-yaml
      - id: check-added-large-files
