    <text x="790" y="712" class="label">SQ · 8</text>
    <path d="M 828 704 H 846 V 617 H 830" class="memlink" marker-end="url(#memory-arrow)"/>
  </g>
  <path d="M 856 711 H 879" class="memlink"/>
  <circle cx="879" cy="711" r="13" class="port"/>
