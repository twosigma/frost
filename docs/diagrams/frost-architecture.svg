<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">FROST on the Alveo X3</title>
  <desc id="desc">A two-wide RV64GCB CPU executes out of order and commits in order.
    Instruction and data ports reach local BRAM or separate L1 caches backed by
    a shared L2 and DDR4. The Sv39 walker and Ethernet DMA enter the shared
    hierarchy through coherence sequencers. MMIO connects UART, timers, PLIC,
    and NIC registers. Arrows show selected request paths, not pipeline timing.</desc>
  <!-- Capacities: riscv_pkg.sv, frost.sv, and boards/x3/x3_frost.sv.
       Memory connections: cpu_and_mem.sv and frost_cache_hierarchy.sv.
       Detailed scheduling and arbitration have separate diagrams. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#8acbd4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #edf3fc; }
      .title { font-size: 36px; font-weight: 700; }
      .heading { font-size: 24px; font-weight: 650; }
      .body { font-size: 20px; fill: #c4d1e2; }
      .small { font-size: 18px; fill: #c4d1e2; }
      .box { stroke-width: 1.5; }
      .cpu { fill: #153149; stroke: #42748f; }
      .memory { fill: #16342f; stroke: #4b8674; }
      .device { fill: #2b2547; stroke: #8270b7; }
      .link { fill: none; stroke: #8acbd4; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1040" rx="20" fill="#101d30"/>
  <text x="50" y="65" class="title">FROST on the Alveo X3</text>
  <text x="50" y="101" class="body">RV64GCB · 300 MHz · Debian and FreeRTOS</text>
  <rect x="50" y="140" width="1100" height="310" rx="16" fill="#142439" stroke="#3b5573"/>
  <text x="78" y="182" class="heading">CPU · two-wide decode, dispatch, and commit</text>
  <rect x="80" y="214" width="290" height="116" rx="12" class="box cpu"/>
  <text x="225.0" y="248" class="heading" text-anchor="middle">Fetch and decode</text>
  <text x="225.0" y="279" class="body" text-anchor="middle">BTB · direction predictor · RAS</text>
  <text x="225.0" y="306" class="body" text-anchor="middle">Sv39 instruction translation</text>
  <rect x="455" y="214" width="290" height="116" rx="12" class="box cpu"/>
  <text x="600.0" y="248" class="heading" text-anchor="middle">Out-of-order execution</text>
  <text x="600.0" y="279" class="body" text-anchor="middle">Six reservation stations</text>
  <text x="600.0" y="306" class="body" text-anchor="middle">Two ALUs · integer / FP units</text>
  <rect x="830" y="214" width="290" height="116" rx="12" class="box cpu"/>
  <text x="975.0" y="248" class="heading" text-anchor="middle">In-order commit</text>
  <text x="975.0" y="279" class="body" text-anchor="middle">32-entry reorder buffer</text>
  <text x="975.0" y="306" class="body" text-anchor="middle">Registers · CSRs · traps</text>
  <path d="M 370 272 H 455" class="link"/>
  <path d="M 745 272 H 830" class="link"/>
  <text x="600" y="370" class="body" text-anchor="middle">Two result-broadcast lanes · load/store queues · LQ L0 cache</text>
  <text x="600" y="413" class="body" text-anchor="middle">M / S / U privilege · Sv39 translation · precise exceptions · JTAG halt and step</text>
  <path d="M 175 450 V 520" class="link"/>
  <text x="187" y="492" class="small">I + D</text>
  <path d="M 460 450 V 520" class="link"/>
  <text x="472" y="492" class="small">Instructions</text>
  <path d="M 740 450 V 520" class="link"/>
  <text x="752" y="492" class="small">Data</text>
  <path d="M 1025 450 V 520" class="link"/>
  <text x="1037" y="492" class="small">Device accesses</text>
  <rect x="50" y="520" width="250" height="112" rx="12" class="box memory"/>
  <text x="175.0" y="554" class="heading" text-anchor="middle">Local BRAM</text>
  <text x="175.0" y="585" class="body" text-anchor="middle">256 KiB</text>
  <text x="175.0" y="612" class="body" text-anchor="middle">Uncached code and data</text>
  <rect x="340" y="520" width="240" height="112" rx="12" class="box memory"/>
  <text x="460.0" y="554" class="heading" text-anchor="middle">L1I · 16 KiB</text>
  <text x="460.0" y="585" class="body" text-anchor="middle">Fetch buffer upstream</text>
  <text x="460.0" y="612" class="body" text-anchor="middle">2 active + 6 victim lines</text>
  <rect x="620" y="520" width="240" height="112" rx="12" class="box memory"/>
  <text x="740.0" y="554" class="heading" text-anchor="middle">L1D · 128 KiB</text>
  <text x="740.0" y="585" class="body" text-anchor="middle">Write-back</text>
  <text x="740.0" y="612" class="body" text-anchor="middle">Non-blocking</text>
  <rect x="900" y="520" width="250" height="112" rx="12" class="box device"/>
  <text x="1025.0" y="554" class="heading" text-anchor="middle">MMIO</text>
  <text x="1025.0" y="585" class="body" text-anchor="middle">UART · CLINT · PLIC</text>
  <text x="1025.0" y="612" class="body" text-anchor="middle">NIC and DMA registers</text>
  <path d="M 460 632 V 666 H 600 V 705" class="link"/>
  <path d="M 740 632 V 666 H 600" fill="none" stroke="#8acbd4" stroke-width="2"/>
  <rect x="50" y="705" width="250" height="112" rx="12" class="box memory"/>
  <text x="175.0" y="739" class="heading" text-anchor="middle">Sv39 walker</text>
  <text x="175.0" y="770" class="body" text-anchor="middle">Shared by I/D TLBs</text>
  <text x="175.0" y="797" class="body" text-anchor="middle">Coherent page-table reads</text>
  <rect x="340" y="705" width="520" height="112" rx="12" class="box memory"/>
  <text x="600.0" y="739" class="heading" text-anchor="middle">Shared L2 · 2 MiB</text>
  <text x="600.0" y="770" class="body" text-anchor="middle">UltraRAM · write-back</text>
  <text x="600.0" y="797" class="body" text-anchor="middle">32-byte lines across L1I, L1D, and L2</text>
  <rect x="900" y="705" width="250" height="112" rx="12" class="box device"/>
  <text x="1025.0" y="739" class="heading" text-anchor="middle">10G Ethernet NIC</text>
  <text x="1025.0" y="770" class="body" text-anchor="middle">Coherent DMA</text>
  <text x="1025.0" y="797" class="body" text-anchor="middle">10GBASE-R MAC / PCS</text>
  <path d="M 300 758 H 340" class="link"/>
  <path d="M 900 758 H 860" class="link"/>
  <text x="1025" y="677" class="small" text-anchor="middle">DMA through coherence logic</text>
  <path d="M 600 817 V 873" class="link"/>
  <text x="615" y="852" class="small">AXI bridge + DDR controller</text>
  <rect x="390" y="873" width="420" height="90" rx="12" class="box memory"/>
  <text x="600.0" y="907" class="heading" text-anchor="middle">DDR4 · 1 GiB</text>
  <text x="600.0" y="938" class="body" text-anchor="middle">Cached region at 0x8000_0000</text>
  <text x="600" y="1006" class="small" text-anchor="middle">Logical request paths; detailed CPU, cache, and board connections have separate diagrams.</text>
</svg>
