  <text x="600" y="1176" class="label center">Tagged line-port arbitration · L1D &gt; walker &gt; L1I &gt; DMA · 2:1 under a bounded 3:1</text>
  <path d="M 226 1194 V 1222" class="memlink" marker-end="url(#memory-arrow)"/>
  <g id="l2-and-ddr" class="center">
