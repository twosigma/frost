    <circle cx="790" cy="56" r="4" fill="#6dcee9"/>
    <text x="803" y="62">Instruction flow</text>
    <circle cx="989" cy="56" r="4" fill="#b5a1f8"/>
    <text x="1002" y="62">Results</text>
