    <text x="810" y="313" class="body">8 branch checkpoints</text>
    <path d="M 80 288 H 65" class="memlink"/>
    <circle cx="64" cy="288" r="13" class="port"/>
    <text x="64" y="294" class="port-text">I</text>
  </g>

