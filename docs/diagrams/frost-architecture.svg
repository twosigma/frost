    <text x="803" y="92">Commit / control</text>
    <circle cx="989" cy="86" r="4" fill="#7ed8bc"/>
    <text x="1002" y="92">Memory</text>
  </g>

  <!-- CPU: dispatch allocates ROB and RS in parallel; RS issue to FUs. -->
