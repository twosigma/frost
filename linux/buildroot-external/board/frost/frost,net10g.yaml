%YAML 1.2
---
$id: http://devicetree.org/schemas/net/frost,net10g.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FROST net10g 10GBASE-R network interface

maintainers:
  - FROST maintainers

description: |
  The FROST SoC's 10 Gigabit Ethernet controller: a soft 10GBASE-R MAC/PCS
  with RX and TX descriptor rings in system memory on the cache hierarchy's
  coherent DMA port, and one level interrupt. The register map and the
  descriptor and completion contract are documented with the RTL
  (hw/rtl/peripherals/nic/README.md); the ABI version is in the ID register.
  Descriptors are 16 bytes, two per 32-byte line; software posts them below
  a TAIL doorbell and reads completion (DD) from the descriptor's status
  word. DMA is coherent with the CPU caches, so the node carries
  dma-coherent and the driver uses no cache maintenance.

allOf:
  - $ref: ethernet-controller.yaml#

properties:
  compatible:
    const: frost,net10g

  reg:
    maxItems: 1
    description: The 4 KiB register window.

  interrupts:
    maxItems: 1
    description: The NIC's level interrupt (PLIC source).

  dma-coherent: true

  local-mac-address: true

  mac-address: true

  clock-frequency:
    description:
      The core clock the register block runs on, in Hz. The interrupt
      moderation tick (TICK register) counts cycles of this clock.

required:
  - compatible
  - reg
  - interrupts
  - dma-coherent
  - clock-frequency

additionalProperties: false

examples:
  - |
    ethernet@40030000 {
        compatible = "frost,net10g";
        reg = <0x40030000 0x1000>;
        interrupt-parent = <&plic>;
        interrupts = <4>;
        dma-coherent;
        local-mac-address = [02 11 22 33 44 55];
        clock-frequency = <300000000>;
    };
