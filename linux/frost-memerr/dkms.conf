#
# DKMS package of the FROST memory error unit driver. This directory is the
# package's source tree, installed as /usr/src/frost-memerr-<PACKAGE_VERSION>/.
# DKMS builds it with its default command, make -C <kernel build dir> M=<build
# dir>, which the Makefile turns into a module build. See README.md.

PACKAGE_NAME="frost-memerr"
# Must equal MODULE_VERSION in frost_memerr.c
PACKAGE_VERSION="1.1"

BUILT_MODULE_NAME[0]="frost_memerr"
# Debian's DKMS installs into updates/dkms whatever this names.
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Build and install it for every kernel installed later, given its headers.
AUTOINSTALL="yes"
# The Kconfig's dependencies, which the module build does not consult: DKMS
# skips a kernel that lacks one.
BUILD_EXCLUSIVE_CONFIG="CONFIG_OF CONFIG_HAS_IOMEM CONFIG_64BIT"
