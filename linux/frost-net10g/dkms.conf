#
# DKMS package of the FROST net10g NIC driver. This directory is the package's
# source tree, installed as /usr/src/frost-net10g-<PACKAGE_VERSION>/. DKMS
# builds it with its default command, make -C <kernel build dir> M=<build
# dir>, which the Makefile turns into a module build. See README.md.

PACKAGE_NAME="frost-net10g"
# The driver's MODULE_VERSION
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="frost_net10g"
# Debian's DKMS installs into updates/dkms whatever this names.
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Build and install it for every kernel installed later, given its headers.
AUTOINSTALL="yes"
# The Kconfig's dependencies, which the module build does not consult: DKMS
# skips a kernel that lacks one.
BUILD_EXCLUSIVE_CONFIG="CONFIG_OF CONFIG_HAS_IOMEM CONFIG_HAS_DMA"
