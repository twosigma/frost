name: ASIC Flow

on:
  push:
    branches: [main]
  # A pull request starts no run by itself. Adding the run-asic label to it
  # starts one run of synthesis and floorplanning on the commit that merges
  # its current head into main, which a pull request's run checks out. Any
  # other label starts a run whose gate job skips the rest. To run again
  # after a later push, remove the label and add it again, or start a manual
  # run on the branch.
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

# The workflow only reads source and publishes its own artifacts.
permissions:
  contents: read

# Synthesis and floorplanning take two to three hours, longer than the gap
# between pushes to main, so a newer push must not cancel them. On main, a
# started run finishes; the most recently queued run waits behind it, and
# GitHub keeps only one pending run per group, so a run still pending when
# another run is queued is canceled in its favor. A pull request keeps one
# run, on purpose: adding run-asic again cancels the run in progress that an
# earlier labeling started, and the new run takes its place. Adding some
# other label starts a run in a group of its own, so it does not cancel the
# pull request's run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'run-asic' && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with Dockerfile.
  VERILATOR_VERSION: "5.052"
  YOSYS_VERSION: "0.70"
  SBY_VERSION: "0.70"

jobs:
  # A pull request's run does the flow only when the label that started it is
  # run-asic. The image build depends on this job's output and the flow's job
  # depends on the image build, so they are skipped with it. Pushes to main
  # and manual runs always run synthesis and floorplanning.
  gate:
    name: Select jobs (ASIC Flow)
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Decide whether the flow runs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED: ${{ github.event.label.name }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'run-asic') }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            run=true
          elif [ "$ACTION" = labeled ] && [ "$ADDED" != run-asic ]; then
            run=false
          elif [ "$LABELED" = true ]; then
            run=true
          else
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The frost image that prepares the sources for the flow.
  build-docker:
    name: Build Docker Image (ASIC Flow)
    runs-on: ubuntu-26.04
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and export Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          tags: frost-dev:latest
          build-args: |
            VERILATOR_VERSION=${{ env.VERILATOR_VERSION }}
            YOSYS_VERSION=${{ env.YOSYS_VERSION }}
            SBY_VERSION=${{ env.SBY_VERSION }}
          outputs: type=docker,dest=/tmp/frost-dev.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frost-docker-image
          path: /tmp/frost-dev.tar
          retention-days: 1

  # Synthesis and floorplanning in OpenROAD-flow-scripts on Nangate45, with
  # the RAM wrappers' memories as the OpenRAM SRAM macros in asic/sram and
  # the other memories over 4,096 bits mocked as one row (asic/README.md).
  # The frost image prepares the sources; the flow runs in the ORFS image
  # that asic/orfs.py pins, with a 256 KiB L2 (asic/config.mk). The job
  # checks that the design maps to the standard cells and the SRAM macros
  # and floorplans with them, and its summary shows the cells, the macros,
  # and each step's time and memory. The rest of the flow, from placement
  # to GDS, runs with ./asic/orfs.py run outside CI (asic/README.md).
  #
  # Yosys peaks at about 10 GiB and runs on one thread for most of the
  # job's two to three hours. --memory-limit 75% keeps the RAM that the
  # flow's container holds within three quarters of the runner's, so that a
  # quarter stays with the runner's own processes. Past its limit the
  # container's memory goes to the runner's swap space, and when that is
  # full too, the kernel stops the flow; the job then fails and uploads its
  # logs. orfs.py logs the memory in use every minute.
  #
  # Every step has a time limit of its own. The setup steps' limits are at
  # least three times the longest that each took in four earlier runs, 2.75
  # minutes at most; the run step's, 265 minutes, is about one and a half
  # times its longest, 181; the steps after it take seconds. The job's limit
  # is the sum of the steps' and four minutes for the runner's own setup and
  # completion.
  asic-flow-synth:
    name: ASIC Flow (synthesis and floorplan)
    runs-on: ubuntu-26.04
    needs: build-docker
    timeout-minutes: 315
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        timeout-minutes: 5

      - name: Free disk space
        timeout-minutes: 10
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          nproc
          free -h
          df -h / /mnt

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        timeout-minutes: 10
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        timeout-minutes: 5
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      # The runner stops a step at its time limit, or when the run is
      # canceled, by signaling the step's process. exec makes that process
      # orfs.py, which then stops the flow and removes its container.
      - name: Run synthesis and floorplanning
        timeout-minutes: 265
        run: |
          exec ./asic/orfs.py run --frost-image frost-dev:latest --target floorplan \
            --memory-limit 75%

      # The runner kills orfs.py ten seconds after it first signals it, which
      # leaves the flow's container behind if Docker has not removed it by
      # then. Every container that orfs.py starts for the flow and its
      # summary carries this label. A listing or removal that fails fails the
      # step.
      - name: Remove the flow's containers
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          containers=$(docker ps --all --quiet --filter label=org.frost.asic-flow)
          if [ -n "$containers" ]; then
            echo "$containers" | xargs docker rm --force
          fi

      - name: Show disk and memory use
        if: always()
        timeout-minutes: 2
        run: |
          df -h / /mnt
          free -h
          du -sh asic/build 2>/dev/null || true

      - name: Publish the summary
        if: always()
        timeout-minutes: 2
        run: |
          if [ -f asic/build/summary.md ]; then
            cat asic/build/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        timeout-minutes: 10
        with:
          name: asic-flow-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            asic/build/orfs.log
            asic/build/elapsed.txt
            asic/build/summary.md
            asic/build/logs/
            asic/build/reports/
