name: ASIC Flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads source and publishes its own artifacts.
permissions:
  contents: read

# The flow takes about fifteen hours end to end, longer than the gap between
# pushes to main, so a newer push must not cancel it. On main, a started run
# finishes; the most recently queued run waits behind it, and GitHub keeps only
# one pending run per group, so a run still pending when another run is queued
# is cancelled in its favour. A pull request keeps one run, and a
# newer push to it cancels the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with Dockerfile.
  VERILATOR_VERSION: "5.052"
  YOSYS_VERSION: "0.70"
  SBY_VERSION: "0.70"

jobs:
  # The frost image that prepares the sources for the flow.
  build-docker:
    name: Build Docker Image (ASIC Flow)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and export Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          tags: frost-dev:latest
          build-args: |
            VERILATOR_VERSION=${{ env.VERILATOR_VERSION }}
            YOSYS_VERSION=${{ env.YOSYS_VERSION }}
            SBY_VERSION=${{ env.SBY_VERSION }}
          outputs: type=docker,dest=/tmp/frost-dev.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frost-docker-image
          path: /tmp/frost-dev.tar
          retention-days: 1

  # OpenROAD-flow-scripts from synthesis to GDS on Nangate45, with the RAM
  # wrappers' memories as the OpenRAM SRAM macros in asic/sram and the other
  # memories over 4,096 bits mocked as one row (asic/README.md). The frost
  # image prepares the sources; the flow runs in the ORFS image that
  # asic/orfs.py pins, with a 256 KiB L2 (asic/config.mk). Global routing,
  # detailed routing, and the final report use swap space on standard runners.
  # The flow runs in five chained jobs, each with a six-hour limit: synthesis
  # with floorplanning, placement with clock tree synthesis, global routing,
  # detailed routing, and the GDS with the final report, each resuming from the
  # database of the one before. On four cores, synthesis with floorplanning
  # takes about three hours and placement with clock tree synthesis under three.
  asic-flow-synth:
    name: ASIC Flow (synthesis and floorplan)
    runs-on: ubuntu-26.04
    needs: build-docker
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          nproc
          free -h
          df -h / /mnt

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Run synthesis and floorplanning
        run: ./asic/orfs.py run --frost-image frost-dev:latest --target floorplan

      - name: Pack the floorplan database
        run: |
          tar -C asic -cf asic-flow-floorplan.tar \
            build/orfs.log build/sources.mk build/src build/objects build/logs build/reports \
            build/results/nangate45/frost/base/2_floorplan.odb \
            build/results/nangate45/frost/base/2_floorplan.sdc

      - name: Upload the floorplan database
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asic-flow-floorplan
          path: asic-flow-floorplan.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload logs and reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asic-flow-synth-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            asic/build/orfs.log
            asic/build/elapsed.txt
            asic/build/summary.md
            asic/build/logs/
            asic/build/reports/

  asic-flow-place:
    name: ASIC Flow (placement and clock tree synthesis)
    runs-on: ubuntu-26.04
    needs: asic-flow-synth
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          nproc
          free -h
          df -h / /mnt

      # Global placement peaks near the runner's 16 GB.
      - name: Add swap space
        run: |
          swapfile=/mnt/asic-flow.swap
          if ! sudo fallocate -l 8G "$swapfile"; then
            swapfile=/asic-flow.swap
            sudo fallocate -l 8G "$swapfile"
          fi
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

      - name: Download the floorplan database
        uses: actions/download-artifact@v8.0.2
        with:
          name: asic-flow-floorplan

      - name: Unpack the floorplan database
        run: |
          tar -C asic -xf asic-flow-floorplan.tar
          rm asic-flow-floorplan.tar

      # asic/orfs.py stops this step within minutes if global placement
      # diverges, instead of letting it run to OpenROAD's iteration limit.
      - name: Run placement through clock tree synthesis
        run: ./asic/orfs.py run --from place --target cts

      - name: Pack the clock tree database
        run: |
          tar -C asic -cf asic-flow-cts.tar \
            build/orfs.log build/sources.mk build/src build/objects build/logs build/reports \
            build/results/nangate45/frost/base/4_cts.odb \
            build/results/nangate45/frost/base/4_cts.sdc

      - name: Upload the clock tree database
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asic-flow-cts
          path: asic-flow-cts.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload logs and reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asic-flow-place-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            asic/build/orfs.log
            asic/build/elapsed.txt
            asic/build/summary.md
            asic/build/logs/
            asic/build/reports/

  asic-flow-grt:
    name: ASIC Flow (global routing)
    runs-on: ubuntu-26.04
    needs: asic-flow-place
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          nproc
          df -h / /mnt

      - name: Add swap space
        run: |
          swapfile=/mnt/asic-flow.swap
          if ! sudo fallocate -l 8G "$swapfile"; then
            swapfile=/asic-flow.swap
            sudo fallocate -l 8G "$swapfile"
          fi
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

      - name: Download the clock tree database
        uses: actions/download-artifact@v8.0.2
        with:
          name: asic-flow-cts

      - name: Unpack the clock tree database
        run: |
          tar -C asic -xf asic-flow-cts.tar
          rm asic-flow-cts.tar

      - name: Run global routing
        run: ./asic/orfs.py run --from grt --target grt

      - name: Pack the global routing database
        run: |
          tar -C asic -cf asic-flow-grt.tar \
            build/orfs.log build/sources.mk build/src build/objects build/logs build/reports \
            build/results/nangate45/frost/base/5_1_grt.odb \
            build/results/nangate45/frost/base/5_1_grt.sdc

      - name: Upload the global routing database
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asic-flow-grt
          path: asic-flow-grt.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload logs and reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asic-flow-grt-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            asic/build/orfs.log
            asic/build/elapsed.txt
            asic/build/summary.md
            asic/build/logs/
            asic/build/reports/

  asic-flow-route:
    name: ASIC Flow (detailed routing)
    runs-on: ubuntu-26.04
    needs: asic-flow-grt
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          nproc
          df -h / /mnt

      # Detailed routing reuses global routing's pin access (asic/config.mk).
      # It peaks at about 29 GiB, in its first iteration.
      - name: Add swap space
        run: |
          swapfile=/mnt/asic-flow.swap
          if ! sudo fallocate -l 24G "$swapfile"; then
            swapfile=/asic-flow.swap
            sudo fallocate -l 24G "$swapfile"
          fi
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

      - name: Download the global routing database
        uses: actions/download-artifact@v8.0.2
        with:
          name: asic-flow-grt

      - name: Unpack the global routing database
        run: |
          tar -C asic -xf asic-flow-grt.tar
          rm asic-flow-grt.tar

      - name: Run detailed routing
        run: ./asic/orfs.py run --from route --target route

      - name: Pack the detailed routing database
        run: |
          tar -C asic -cf asic-flow-route.tar \
            build/orfs.log build/sources.mk build/src build/objects build/logs build/reports \
            build/results/nangate45/frost/base/5_route.odb \
            build/results/nangate45/frost/base/5_route.sdc

      - name: Upload the detailed routing database
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asic-flow-route
          path: asic-flow-route.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload logs and reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asic-flow-route-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            asic/build/orfs.log
            asic/build/elapsed.txt
            asic/build/summary.md
            asic/build/logs/
            asic/build/reports/

  asic-flow-finish:
    name: ASIC Flow (GDS and final report)
    runs-on: ubuntu-26.04
    needs: asic-flow-route
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          nproc
          df -h / /mnt

      # The final report peaks at about 39 GiB.
      - name: Add swap space
        run: |
          swapfile=/mnt/asic-flow.swap
          if ! sudo fallocate -l 32G "$swapfile"; then
            swapfile=/asic-flow.swap
            sudo fallocate -l 32G "$swapfile"
          fi
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

      - name: Download the detailed routing database
        uses: actions/download-artifact@v8.0.2
        with:
          name: asic-flow-route

      - name: Unpack the detailed routing database
        run: |
          tar -C asic -xf asic-flow-route.tar
          rm asic-flow-route.tar

      - name: Run the GDS and the final report
        run: ./asic/orfs.py run --from finish

      - name: Publish the summary
        if: always()
        run: |
          if [ -f asic/build/summary.md ]; then
            cat asic/build/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: asic-flow-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            asic/build/orfs.log
            asic/build/elapsed.txt
            asic/build/summary.md
            asic/build/logs/
            asic/build/reports/
