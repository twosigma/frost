name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads source and publishes its own artifacts.
permissions:
  contents: read

# Cancel obsolete simulation jobs after a newer push to the same PR or ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with Dockerfile.
  VERILATOR_VERSION: "5.050"
  YOSYS_VERSION: "0.64"
  SBY_VERSION: "0.63"

jobs:
  # Shared image for all jobs.
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: frost-dev:latest
          build-args: |
            VERILATOR_VERSION=${{ env.VERILATOR_VERSION }}
            YOSYS_VERSION=${{ env.YOSYS_VERSION }}
            SBY_VERSION=${{ env.SBY_VERSION }}
          outputs: type=docker,dest=/tmp/frost-dev.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp/frost-dev.tar
          retention-days: 1

  # Shard BRAM-tier cocotb tests to avoid one job timeout.
  test-verilator:
    name: Cocotb ${{ matrix.shard }} (Verilator / bram)
    runs-on: ubuntu-24.04
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: Real Programs (non-CoreMark-PRO)
            pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
          - shard: Unit Tests
            pytest_mark: "cocotb and cocotb_unit"
          - shard: Real Programs (CoreMark-PRO)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run Cocotb ${{ matrix.shard }} with Verilator
        run: |
          docker run --rm -e FROST_REQUIRE_OPENOCD=1 -v ${{ github.workspace }}:/workspace frost-dev:latest \
            pytest tests/test_run_cocotb.py -m "${{ matrix.pytest_mark }}" -v

  # Relink BRAM-job programs into cached DDR to cover L1I fetch and the D-side
  # cached tier. Unit benches are tier-independent; fuzz/ddr_* self-skip here.
  test-verilator-ddr:
    name: Cocotb Real Programs (Verilator / ddr)
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run Cocotb real programs in the DDR tier
        run: |
          docker run --rm -e FROST_COCOTB_MEM_CONFIG=ddr -e FROST_REQUIRE_OPENOCD=1 -v ${{ github.workspace }}:/workspace frost-dev:latest \
            pytest tests/test_run_cocotb.py -m cocotb -k test_real_program -v

  # Architecture tests by extension and execution tier:
  #   bram - code + data + signature in low BRAM (pure ISA conformance, the
  #          low tier programs use when they fit).
  #   ddr  - code + data + signature in cached DDR (also exercises the L1I
  #          fetch path and the D-side cached tier on every load/store).
  # Local-only ``icache`` (code in DDR, data/signature in BRAM) isolates fetch;
  # it is diagnostic, not a compliance target.
  test-arch-compliance:
    name: Arch Tests (${{ matrix.extension }} / ${{ matrix.mem_config }})
    runs-on: ubuntu-24.04
    # Headroom beyond per-test timeouts for slow extension batches.
    timeout-minutes: 300
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        # Zcf is RV32-only; its C.FLW/C.FSW slots encode C.LD/C.SD on RV64.
        extension: [I, M, A, F, D, C, B, K, Zicond, Zifencei, privilege, D_Zcd, hints]
        mem_config: [bram, ddr]
        # Zifencei self-modifying code needs cached DDR. Low BRAM is Harvard:
        # stores cannot update instruction BRAM, and fence.i only maintains the
        # cached tier.
        exclude:
          - extension: Zifencei
            mem_config: bram
          # F/D DDR batches exceed hosted-runner budgets. BRAM covers FPU
          # conformance; other DDR tiers cover the cache path.
          - extension: F
            mem_config: ddr
          - extension: D
            mem_config: ddr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run arch compliance tests (${{ matrix.extension }} / ${{ matrix.mem_config }})
        run: |
          if [ -n "${{ matrix.test_path }}" ]; then
            docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
              python3 tests/test_arch_compliance.py --test ${{ matrix.test_path }} \
                --mem-config ${{ matrix.mem_config }}
          else
            docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
              python3 tests/test_arch_compliance.py --extensions ${{ matrix.extension }} \
                --mem-config ${{ matrix.mem_config }}
          fi

  # riscv-tests ISA suites by memory tier and environment. p = bare M-mode
  # (the -p variants). v = demand-paged Sv39 user code under the env_v
  # supervisor kernel (the -v variants: translated fetch and data, delegated
  # page faults, Svade A/D handling); v runs on DDR only, user-level suites only.
  test-riscv-tests:
    name: riscv-tests (${{ matrix.suite }} / ${{ matrix.mem_config }} / ${{ matrix.env }})
    runs-on: ubuntu-24.04
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        suite: [rv64ui, rv64um, rv64ua, rv64uc, rv64uf, rv64ud, rv64uzba, rv64uzbb, rv64uzbs, rv64uzbkb, rv64mi, rv64si]
        mem_config: [bram, ddr]
        env: [p]
        include:
          - {suite: rv64ui, mem_config: ddr, env: v}
          - {suite: rv64um, mem_config: ddr, env: v}
          - {suite: rv64ua, mem_config: ddr, env: v}
          - {suite: rv64uc, mem_config: ddr, env: v}
          - {suite: rv64uf, mem_config: ddr, env: v}
          - {suite: rv64ud, mem_config: ddr, env: v}
          - {suite: rv64uzba, mem_config: ddr, env: v}
          - {suite: rv64uzbb, mem_config: ddr, env: v}
          - {suite: rv64uzbs, mem_config: ddr, env: v}
          - {suite: rv64uzbkb, mem_config: ddr, env: v}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run riscv-tests ISA suite (${{ matrix.suite }} / ${{ matrix.mem_config }} / ${{ matrix.env }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_riscv_tests.py --suites ${{ matrix.suite }} \
              --mem-config ${{ matrix.mem_config }} --env ${{ matrix.env }}

  # riscv-tests benchmarks by memory tier.
  test-riscv-benchmarks:
    name: riscv-tests Benchmarks (${{ matrix.benchmark }} / ${{ matrix.mem_config }})
    runs-on: ubuntu-24.04
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        benchmark: [median, multiply, qsort, rsort, towers, vvadd, dhrystone, mm, spmv]
        mem_config: [bram, ddr]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run riscv-tests benchmark (${{ matrix.benchmark }} / ${{ matrix.mem_config }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_riscv_tests.py --benchmarks ${{ matrix.benchmark }} \
              --mem-config ${{ matrix.mem_config }}

  # RV64 riscv-torture corpus against Spike references, by memory tier, plus
  # the paged environment (S-mode under an Sv39 identity map: every fetch and
  # data access of the random stream translated; ddr only).
  test-riscv-torture:
    name: riscv-torture Tests (${{ matrix.mem_config }}${{ matrix.paged && ' / paged' || '' }})
    runs-on: ubuntu-24.04
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        mem_config: [bram, ddr]
        paged: [false]
        include:
          - {mem_config: ddr, paged: true}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run riscv-torture tests (${{ matrix.mem_config }}${{ matrix.paged && ' / paged' || '' }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_riscv_torture.py --all \
              --mem-config ${{ matrix.mem_config }} ${{ matrix.paged && '--paged' || '' }}

  # Yosys synthesis.
  test-synthesis:
    name: Yosys Synthesis Check
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run synthesis tests
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            pytest tests/ -m synthesis -v

  # SymbiYosys formal verification.
  test-formal:
    name: Formal Verification
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run formal verification
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            pytest tests/ -m formal -v

  # Run the pinned pre-commit environment in Docker.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fetch only submodules needed by clang-tidy includes; skip entrypoint
      # auto-init so lint does not fetch Buildroot.
      - name: Fetch the submodules clang-tidy lints against
        run: |
          git submodule update --init --recursive \
            sw/FreeRTOS-Kernel \
            sw/apps/coremark/coremark \
            sw/apps/coremark_pro/coremark-pro \
            sw/apps/riscv_tests/riscv-tests

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run pre-commit hooks
        run: |
          docker run --rm -e FROST_SKIP_SUBMODULE_INIT=1 \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            pre-commit run --all-files

  # Python/tooling tests only. The runner UID/GID also tests non-root containers.
  test-python:
    name: Fast Python Tests
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run fast Python tests as the host user
        run: |
          # Keep the entrypoint to catch non-root path-permission regressions.
          docker run --rm --init --pull=never \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env FROST_SKIP_SUBMODULE_INIT=1 \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            frost-dev:latest \
            pytest tests \
              -m "not cocotb and not synthesis and not formal and not slow" -v

  # Build one no-MMU M-mode Linux image, then boot it on RTL and QEMU.

  # Build kernel, BusyBox initramfs, and memory images from pinned Buildroot and
  # the BR2_EXTERNAL tree. Dockerfile supplies host dependencies; dl/ and ccache
  # accelerate the otherwise full RV64 uClibc toolchain build. Historical
  # ``-rv64`` names keep existing caches warm.
  build-frost-linux:
    name: Build FROST Linux Image (Buildroot)
    runs-on: ubuntu-24.04
    needs: build-docker
    # Cold ccache builds the full cross toolchain.
    timeout-minutes: 150
    env:
      BR2_DEFCONFIG_NAME: frost_nommu_rv64_defconfig
      BUILD_DIR: linux/build-rv64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the nested Buildroot submodule.
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          # Free the image tar for the ~10 GB Buildroot workspace.
          rm -f /tmp/frost-dev.tar

      - name: Cache Buildroot downloads (source tarballs)
        uses: actions/cache@v4
        with:
          path: linux/dl
          # Package versions determine dl/ contents.
          key: br2-dl-${{ hashFiles('linux/buildroot-external/configs/**', 'linux/buildroot-external/board/frost/**') }}
          restore-keys: |
            br2-dl-

      - name: Cache Buildroot ccache (toolchain + kernel object cache)
        uses: actions/cache@v4
        with:
          path: linux/ccache
          key: br2-ccache-rv64-${{ github.sha }}
          restore-keys: |
            br2-ccache-rv64-
            br2-ccache-

      - name: Build kernel + initramfs + FROST memory images
        run: |
          docker run --rm \
            -e BR2_DL_DIR=/workspace/linux/dl \
            -e BR2_CCACHE_DIR=/workspace/linux/ccache \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            bash -c '
              set -euo pipefail
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }} \
                BR2_EXTERNAL=/workspace/linux/buildroot-external \
                ${{ env.BR2_DEFCONFIG_NAME }}
              # Enable CI-only ccache without changing the defconfig.
              echo "BR2_CCACHE=y" >> /workspace/${{ env.BUILD_DIR }}/.config
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }} olddefconfig
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }}
              # Stage packed images where the cocotb test expects them.
              mkdir -p sw/apps/linux_boot
              cp ${{ env.BUILD_DIR }}/images/sw.mem     sw/apps/linux_boot/sw.mem
              cp ${{ env.BUILD_DIR }}/images/sw_ddr.mem sw/apps/linux_boot/sw_ddr.mem
              ls -l ${{ env.BUILD_DIR }}/images/
            '

      - name: Upload FROST Linux boot images
        uses: actions/upload-artifact@v4
        with:
          name: frost-linux-boot-images-rv64
          path: |
            ${{ env.BUILD_DIR }}/images/Image
            ${{ env.BUILD_DIR }}/images/rootfs.cpio.gz
            ${{ env.BUILD_DIR }}/images/frost-nommu-fpga.dtb
            ${{ env.BUILD_DIR }}/images/sw.mem
            ${{ env.BUILD_DIR }}/images/sw_ddr.mem
          retention-days: 7
          if-no-files-found: error

  # Run ~22M cycles with the Genesys2 cache shape (128 KiB L1I, no L2). The
  # checker requires banner/devtmpfs, no panic, a re-armed mtimecmp, and retire
  # progress through the silent mem_init window. Set CACHED_HAS_L2 via Make env
  # because tests/Makefile overrides a test-local ``-G`` value.
  linux-boot-cocotb:
    name: Cocotb Linux Boot (22M, genesys2 shape)
    runs-on: ubuntu-24.04
    needs: [build-docker, build-frost-linux]
    # Hosted runners simulate about 4-8k cycles/s after compilation.
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          # Free the tar before the long compile and simulation.
          rm -f /tmp/frost-dev.tar

      - name: Download FROST Linux boot images
        uses: actions/download-artifact@v4
        with:
          name: frost-linux-boot-images-rv64
          path: /tmp/frost-linux-images

      - name: Stage boot images for the cocotb linux_boot test
        run: |
          mkdir -p sw/apps/linux_boot
          cp /tmp/frost-linux-images/sw.mem     sw/apps/linux_boot/sw.mem
          cp /tmp/frost-linux-images/sw_ddr.mem sw/apps/linux_boot/sw_ddr.mem

      - name: Run cocotb linux_boot (22M-cycle timer-IRQ-hang regression)
        run: |
          # Preserve the staged artifact across cocotb's clean/rebuild instead
          # of spending ~1h rebuilding and overwriting it.
          docker run --rm \
            -e CACHED_HAS_L2=0 \
            -e FROST_LINUX_RUN_FULL=1 \
            -e FROST_LINUX_PREBUILT=1 \
            -e COCOTB_NUM_RUNS=1 \
            -e COCOTB_LINUX_MAX_CYCLES=22000000 \
            -e COCOTB_PROGRESS_INTERVAL=500000 \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            bash -c '
              set -o pipefail
              cd tests && make clean
              # RUN_FULL runs to the max-cycle timeout assertion by design (its
              # marker never matches); the checker below supplies the verdict.
              ./test_run_cocotb.py linux_boot_128k 2>&1 \
                | tee /workspace/linux_boot_cocotb.log || true
              python3 check_linux_boot_regression.py /workspace/linux_boot_cocotb.log
            '

      - name: Upload cocotb boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-boot-cocotb-log
          path: linux_boot_cocotb.log
          if-no-files-found: ignore

  # Boot the same artifact under QEMU as a fast independent reference. Require
  # the inittab stress payload (timers/signals, vfork/exec, futex, LR/SC) and
  # login prompt.
  linux-boot-qemu:
    name: QEMU Linux Boot (userspace stress + shell)
    runs-on: ubuntu-24.04
    needs: [build-docker, build-frost-linux]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Download FROST Linux boot images
        uses: actions/download-artifact@v4
        with:
          name: frost-linux-boot-images-rv64
          path: /tmp/frost-linux-images

      - name: Boot through userspace under QEMU (assert stress token + login prompt)
        run: |
          docker run --rm -v /tmp/frost-linux-images:/img frost-dev:latest \
            bash -c '
              set -euo pipefail
              # Time-box the persistent login prompt. Capture to a file because
              # piping QEMU stdout to grep deadlocks.
              timeout -k5 120 qemu-system-riscv64 -M virt -bios none \
                -kernel /img/Image \
                -append "earlycon=sbi console=ttyS0 rdinit=/sbin/init" \
                -initrd /img/rootfs.cpio.gz -nographic -cpu rv64,mmu=off \
                </dev/null >/tmp/qemu-boot.log 2>&1 || true
              echo "===== QEMU boot log (tail) ====="
              tail -n 20 /tmp/qemu-boot.log
              # Require stress completion before the getty and login prompt.
              grep -q "FROST_USERSPACE_STRESS_PASS" /tmp/qemu-boot.log
              grep -q "buildroot login:" /tmp/qemu-boot.log
            '
