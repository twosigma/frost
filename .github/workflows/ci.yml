name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads source and publishes its own artifacts.
permissions:
  contents: read

# Cancel obsolete simulation jobs after a newer push to the same PR or ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with Dockerfile.
  VERILATOR_VERSION: "5.050"
  YOSYS_VERSION: "0.64"
  SBY_VERSION: "0.63"

jobs:
  # Shared image for all jobs.
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: frost-dev:latest
          build-args: |
            VERILATOR_VERSION=${{ env.VERILATOR_VERSION }}
            YOSYS_VERSION=${{ env.YOSYS_VERSION }}
            SBY_VERSION=${{ env.SBY_VERSION }}
          outputs: type=docker,dest=/tmp/frost-dev.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp/frost-dev.tar
          retention-days: 1

  # Run real-program shards independently in both memory tiers. Keep the long
  # benchmarks/torture runs separate and group matching custom Verilator builds.
  # Unit benches and DDR probes/fetch fuzz run only on the BRAM axis.
  test-verilator:
    name: Cocotb ${{ matrix.shard.name }} (Verilator / ${{ matrix.mem_config }})
    runs-on: ubuntu-24.04
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        mem_config: [bram, ddr]
        shard:
          - name: Real Programs (CoreMark)
            pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
            pytest_filter: "[coremark]"
          - name: Real Programs (AMO torture)
            pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
            pytest_filter: "[amo_irq_torture_sim]"
          - name: Real Programs (Timer torture)
            pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
            pytest_filter: "[tick_torture_sim]"
          - name: Real Programs (Cache stress)
            pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
            pytest_filter: >-
              [drain_trapframe_test] or [restore_window_stress] or [mret_drain_deadlock] or
              [linux_clksrc_faithful] or [trap_s2l_fwd] or [pde_return_hazard]
          - name: Real Programs (Privilege and MMU)
            pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
            pytest_filter: >-
              [csr_test] or [umode_test] or [pma_fault_test] or [vm_test] or [itlb_test] or
              [satp_drain_test] or [ad_fault_test] or [smode_test] or [csr_rmw_test]
          - name: Real Programs (Interrupts)
            pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
            pytest_filter: >-
              [plic_test] or [sstc_test] or [ns16550_irq_console_test] or [wfi_mepc_test] or
              [wfi_drain_mepc_test] or [mret_timer_resume_test] or [mtimer_stress] or
              [wfi_lost_tick] or [irq_mie_window] or [ns16550_test] or [clint_test] or
              [linux_irq_ddr_test] or [linux_irq_active_ddr_test] or [linux_irq_stack_slot_test] or
              [linux_irq_find_next_slot_test]
          - name: Real Programs (CPU and fetch)
            pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
            pytest_filter: >-
              [branch_pred_test] or [c_ext_test] or [cf_ext_test] or [call_stress] or [fpu_test] or
              [fpu_assembly_test] or [isa_test] or [rv64_smoke] or [rv64_amo_test] or
              [spanning_test] or [ras_test] or [ras_stress_test] or [tomasulo_test] or
              [tomasulo_perf] or [jal_target_seam] or [fetch_lead_repro] or [fetch_stall_repro] or
              [window_skip_repro]
          # The complement keeps new non-CoreMark-PRO programs in CI.
          # Keep it in sync when moving a test into a named shard.
          - name: Real Programs (Runtime and other)
            pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
            pytest_filter: >-
              not ([coremark] or [amo_irq_torture_sim] or [tick_torture_sim] or
              [drain_trapframe_test] or [restore_window_stress] or [mret_drain_deadlock] or
              [linux_clksrc_faithful] or [trap_s2l_fwd] or [pde_return_hazard] or [csr_test] or
              [umode_test] or [pma_fault_test] or [vm_test] or [itlb_test] or [satp_drain_test] or
              [ad_fault_test] or [smode_test] or [csr_rmw_test] or [plic_test] or [sstc_test] or
              [ns16550_irq_console_test] or [wfi_mepc_test] or [wfi_drain_mepc_test] or
              [mret_timer_resume_test] or [mtimer_stress] or [wfi_lost_tick] or [irq_mie_window] or
              [ns16550_test] or [clint_test] or [linux_irq_ddr_test] or [linux_irq_active_ddr_test]
              or [linux_irq_stack_slot_test] or [linux_irq_find_next_slot_test] or
              [branch_pred_test] or [c_ext_test] or [cf_ext_test] or [call_stress] or [fpu_test] or
              [fpu_assembly_test] or [isa_test] or [rv64_smoke] or [rv64_amo_test] or
              [spanning_test] or [ras_test] or [ras_stress_test] or [tomasulo_test] or
              [tomasulo_perf] or [jal_target_seam] or [fetch_lead_repro] or [fetch_stall_repro] or
              [window_skip_repro] or [ddr_test] or [ddr_exec_test] or [ddr_smc_test] or
              [ddr_heap_test] or [ddr_mlp_test] or [ddr_atomic_test] or [hello_world_fetch_fuzz] or
              [branch_pred_test_fetch_fuzz] or [c_ext_test_fetch_fuzz] or [call_stress_fetch_fuzz]
              or [itlb_test_fetch_fuzz] or [opensbi_smoke])
          - name: Real Programs (CoreMark-PRO / core)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
            pytest_filter: "[coremark_pro_core]"
          - name: Real Programs (CoreMark-PRO / cjpeg)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
            pytest_filter: "[coremark_pro_cjpeg]"
          - name: Real Programs (CoreMark-PRO / linear_alg)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
            pytest_filter: "[coremark_pro_linear_alg]"
          - name: Real Programs (CoreMark-PRO / loops)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
            pytest_filter: "[coremark_pro_loops]"
          - name: Real Programs (CoreMark-PRO / nnet)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
            pytest_filter: "[coremark_pro_nnet]"
          - name: Real Programs (CoreMark-PRO / parser)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
            pytest_filter: "[coremark_pro_parser]"
          - name: Real Programs (CoreMark-PRO / radix2)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
            pytest_filter: "[coremark_pro_radix2]"
          - name: Real Programs (CoreMark-PRO / sha)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
            pytest_filter: "[coremark_pro_sha]"
          - name: Real Programs (CoreMark-PRO / zip)
            pytest_mark: "cocotb and cocotb_real_program and coremark_pro"
            pytest_filter: "[coremark_pro_zip]"
        include:
          - mem_config: bram
            shard:
              name: Real Programs (DDR probes and fetch fuzz)
              pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
              pytest_filter: >-
                [ddr_test] or [ddr_exec_test] or [ddr_smc_test] or [ddr_heap_test] or [ddr_mlp_test]
                or [ddr_atomic_test] or [hello_world_fetch_fuzz] or [branch_pred_test_fetch_fuzz] or
                [c_ext_test_fetch_fuzz] or [call_stress_fetch_fuzz] or [itlb_test_fetch_fuzz]
          # OpenSBI smoke: the firmware boot alone is ~4.5M cycles, and its
          # images are layout-fixed, so it gets one runner on one axis.
          - mem_config: bram
            shard:
              name: Real Programs (OpenSBI smoke)
              pytest_mark: "cocotb and cocotb_real_program and not coremark_pro"
              pytest_filter: "[opensbi_smoke]"
          - mem_config: bram
            shard:
              name: Unit Tests
              pytest_mark: "cocotb and cocotb_unit"
              pytest_filter: test_unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run Cocotb ${{ matrix.shard.name }} with Verilator (${{ matrix.mem_config }})
        env:
          FROST_COCOTB_MEM_CONFIG: ${{ matrix.mem_config }}
          FROST_REQUIRE_OPENOCD: "1"
          PYTEST_MARK: ${{ matrix.shard.pytest_mark }}
          PYTEST_FILTER: ${{ matrix.shard.pytest_filter }}
        run: |
          ./scripts/frost.py --image frost-dev:latest pytest \
            -m "$PYTEST_MARK" -k "$PYTEST_FILTER" -v --durations=0

  # Standalone Ethernet uses the shared image but has no CPU/software dependencies.
  test-net10g:
    name: Ethernet MAC/PCS (cocotb and synthesis)
    runs-on: ubuntu-24.04
    needs: build-docker
    timeout-minutes: 35
    env:
      FROST_SKIP_SUBMODULE_INIT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run all standalone Ethernet simulations
        timeout-minutes: 15
        run: |
          mkdir -p tests/net10g/sim_build
          ./scripts/frost.py --image frost-dev:latest run python3 tests/net10g/run.py all \
            2>&1 | tee tests/net10g/sim_build/cocotb.log

      - name: Check portable Ethernet synthesis
        timeout-minutes: 15
        run: |
          ./scripts/frost.py --image frost-dev:latest run python3 tests/net10g/synthesize.py \
            2>&1 | tee tests/net10g/sim_build/synthesis.log

      - name: Upload Ethernet results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net10g-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            tests/net10g/sim_build/*.log
            tests/net10g/sim_build/*/results.xml
            tests/net10g/sim_build/synthesis/*.log
            tests/net10g/sim_build/synthesis/sources.json
            tests/net10g/sim_build/synthesis/summary.json
            tests/net10g/sim_build/synthesis/synthesis.ys

  # Architecture tests by extension and execution tier:
  #   bram - code + data + signature in low BRAM (pure ISA conformance, the
  #          low tier programs use when they fit).
  #   ddr  - code + data + signature in cached DDR (also exercises the L1I
  #          fetch path and the D-side cached tier on every load/store).
  # Local-only ``icache`` (code in DDR, data/signature in BRAM) isolates fetch;
  # it is diagnostic, not a compliance target.
  test-arch-compliance:
    name: Arch Tests (${{ matrix.extension }} / ${{ matrix.mem_config }})
    runs-on: ubuntu-24.04
    # Headroom beyond per-test timeouts for slow extension batches.
    timeout-minutes: 300
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        # Zcf is RV32-only; its C.FLW/C.FSW slots encode C.LD/C.SD on RV64.
        extension: [I, M, A, F, D, C, B, K, Zicond, Zifencei, privilege, D_Zcd, hints]
        mem_config: [bram, ddr]
        # Zifencei self-modifying code needs cached DDR. Low BRAM is Harvard:
        # stores cannot update instruction BRAM, and fence.i only maintains the
        # cached tier.
        exclude:
          - extension: Zifencei
            mem_config: bram
          # F/D DDR batches exceed hosted-runner budgets. BRAM covers FPU
          # conformance; other DDR tiers cover the cache path.
          - extension: F
            mem_config: ddr
          - extension: D
            mem_config: ddr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run arch compliance tests (${{ matrix.extension }} / ${{ matrix.mem_config }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_arch_compliance.py --extensions ${{ matrix.extension }} \
              --mem-config ${{ matrix.mem_config }}

  # riscv-tests ISA suites by memory tier and environment. p = bare M-mode
  # (the -p variants). v = demand-paged Sv39 user code under the env_v
  # supervisor kernel (the -v variants: translated fetch and data, delegated
  # page faults, Svade A/D handling); v runs on DDR only, user-level suites only.
  test-riscv-tests:
    name: riscv-tests (${{ matrix.suite }} / ${{ matrix.mem_config }} / ${{ matrix.env }})
    runs-on: ubuntu-24.04
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        suite: [rv64ui, rv64um, rv64ua, rv64uc, rv64uf, rv64ud, rv64uzba, rv64uzbb, rv64uzbs, rv64uzbkb, rv64mi, rv64si]
        mem_config: [bram, ddr]
        env: [p]
        include:
          - {suite: rv64ui, mem_config: ddr, env: v}
          - {suite: rv64um, mem_config: ddr, env: v}
          - {suite: rv64ua, mem_config: ddr, env: v}
          - {suite: rv64uc, mem_config: ddr, env: v}
          - {suite: rv64uf, mem_config: ddr, env: v}
          - {suite: rv64ud, mem_config: ddr, env: v}
          - {suite: rv64uzba, mem_config: ddr, env: v}
          - {suite: rv64uzbb, mem_config: ddr, env: v}
          - {suite: rv64uzbs, mem_config: ddr, env: v}
          - {suite: rv64uzbkb, mem_config: ddr, env: v}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run riscv-tests ISA suite (${{ matrix.suite }} / ${{ matrix.mem_config }} / ${{ matrix.env }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_riscv_tests.py --suites ${{ matrix.suite }} \
              --mem-config ${{ matrix.mem_config }} --env ${{ matrix.env }}

  # riscv-tests benchmarks by memory tier.
  test-riscv-benchmarks:
    name: riscv-tests Benchmarks (${{ matrix.benchmark }} / ${{ matrix.mem_config }})
    runs-on: ubuntu-24.04
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        benchmark: [median, multiply, qsort, rsort, towers, vvadd, dhrystone, mm, spmv]
        mem_config: [bram, ddr]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run riscv-tests benchmark (${{ matrix.benchmark }} / ${{ matrix.mem_config }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_riscv_tests.py --benchmarks ${{ matrix.benchmark }} \
              --mem-config ${{ matrix.mem_config }}

  # RV64 riscv-torture corpus against Spike references, by memory tier, plus
  # the paged environment (S-mode under an Sv39 identity map: every fetch and
  # data access of the random stream translated; ddr only).
  test-riscv-torture:
    name: riscv-torture Tests (${{ matrix.mem_config }}${{ matrix.paged && ' / paged' || '' }})
    runs-on: ubuntu-24.04
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        mem_config: [bram, ddr]
        paged: [false]
        include:
          - {mem_config: ddr, paged: true}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run riscv-torture tests (${{ matrix.mem_config }}${{ matrix.paged && ' / paged' || '' }})
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_riscv_torture.py --all \
              --mem-config ${{ matrix.mem_config }} ${{ matrix.paged && '--paged' || '' }}

  # Yosys synthesis.
  test-synthesis:
    name: Yosys Synthesis Check
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run synthesis tests
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            pytest tests/ -m synthesis -v

  # SymbiYosys formal verification.
  test-formal:
    name: Formal Verification
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run formal verification
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            pytest tests/ -m formal -v

  # Run the pinned pre-commit environment in Docker.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fetch only submodules needed by clang-tidy includes; skip entrypoint
      # auto-init so lint does not fetch Buildroot.
      - name: Fetch the submodules clang-tidy lints against
        run: |
          git submodule update --init --recursive \
            sw/FreeRTOS-Kernel \
            sw/apps/coremark/coremark \
            sw/apps/coremark_pro/coremark-pro \
            sw/apps/riscv_tests/riscv-tests

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run pre-commit hooks
        run: |
          docker run --rm -e FROST_SKIP_SUBMODULE_INIT=1 \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            pre-commit run --all-files

  # Python/tooling tests only. The runner UID/GID also tests non-root containers.
  test-python:
    name: Fast Python Tests
    runs-on: ubuntu-24.04
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Run fast Python tests as the host user
        run: |
          # Keep the entrypoint to catch non-root path-permission regressions.
          docker run --rm --init --pull=never \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env FROST_SKIP_SUBMODULE_INIT=1 \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            frost-dev:latest \
            pytest tests \
              -m "not cocotb and not synthesis and not formal and not slow" -v

  # Build one no-MMU M-mode Linux image, then boot it on RTL and QEMU.

  # Build kernel, BusyBox initramfs, and memory images from pinned Buildroot and
  # the BR2_EXTERNAL tree. Dockerfile supplies host dependencies; dl/ and ccache
  # accelerate the otherwise full RV64 uClibc toolchain build. Historical
  # ``-rv64`` names keep existing caches warm.
  build-frost-linux:
    name: Build FROST Linux Image (Buildroot)
    runs-on: ubuntu-24.04
    needs: build-docker
    # Cold ccache builds the full cross toolchain.
    timeout-minutes: 150
    env:
      BR2_DEFCONFIG_NAME: frost_nommu_rv64_defconfig
      BUILD_DIR: linux/build-rv64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the nested Buildroot submodule.
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          # Free the image tar for the ~10 GB Buildroot workspace.
          rm -f /tmp/frost-dev.tar

      - name: Cache Buildroot downloads (source tarballs)
        uses: actions/cache@v4
        with:
          path: linux/dl
          # Package versions determine dl/ contents.
          key: br2-dl-${{ hashFiles('linux/buildroot-external/configs/**', 'linux/buildroot-external/board/frost/**') }}
          restore-keys: |
            br2-dl-

      - name: Cache Buildroot ccache (toolchain + kernel object cache)
        uses: actions/cache@v4
        with:
          path: linux/ccache
          key: br2-ccache-rv64-${{ github.sha }}
          restore-keys: |
            br2-ccache-rv64-
            br2-ccache-

      - name: Build kernel + initramfs + FROST memory images
        run: |
          docker run --rm \
            -e BR2_DL_DIR=/workspace/linux/dl \
            -e BR2_CCACHE_DIR=/workspace/linux/ccache \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            bash -c '
              set -euo pipefail
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }} \
                BR2_EXTERNAL=/workspace/linux/buildroot-external \
                ${{ env.BR2_DEFCONFIG_NAME }}
              # Enable CI-only ccache without changing the defconfig.
              echo "BR2_CCACHE=y" >> /workspace/${{ env.BUILD_DIR }}/.config
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }} olddefconfig
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }}
              # Stage packed images where the cocotb test expects them.
              mkdir -p sw/apps/linux_boot
              cp ${{ env.BUILD_DIR }}/images/sw.mem     sw/apps/linux_boot/sw.mem
              cp ${{ env.BUILD_DIR }}/images/sw_ddr.mem sw/apps/linux_boot/sw_ddr.mem
              ls -l ${{ env.BUILD_DIR }}/images/
            '

      - name: Upload FROST Linux boot images
        uses: actions/upload-artifact@v4
        with:
          name: frost-linux-boot-images-rv64
          path: |
            ${{ env.BUILD_DIR }}/images/Image
            ${{ env.BUILD_DIR }}/images/rootfs.cpio.gz
            ${{ env.BUILD_DIR }}/images/frost-nommu-fpga.dtb
            ${{ env.BUILD_DIR }}/images/sw.mem
            ${{ env.BUILD_DIR }}/images/sw_ddr.mem
          retention-days: 7
          if-no-files-found: error

  # Run ~22M cycles with the X3 cache shape (16 KiB L1I and 2 MiB L2). The
  # checker requires banner/devtmpfs, no panic, a re-armed mtimecmp, and retire
  # progress through the silent mem_init window.
  linux-boot-cocotb:
    name: Cocotb Linux Boot (22M, X3 shape)
    runs-on: ubuntu-24.04
    needs: [build-docker, build-frost-linux]
    # Hosted runners simulate about 4-8k cycles/s after compilation.
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          # Free the tar before the long compile and simulation.
          rm -f /tmp/frost-dev.tar

      - name: Download FROST Linux boot images
        uses: actions/download-artifact@v4
        with:
          name: frost-linux-boot-images-rv64
          path: /tmp/frost-linux-images

      - name: Stage boot images for the cocotb linux_boot test
        run: |
          mkdir -p sw/apps/linux_boot
          cp /tmp/frost-linux-images/sw.mem     sw/apps/linux_boot/sw.mem
          cp /tmp/frost-linux-images/sw_ddr.mem sw/apps/linux_boot/sw_ddr.mem

      - name: Run cocotb linux_boot (22M-cycle timer-IRQ-hang regression)
        run: |
          # Preserve the staged artifact across cocotb's clean/rebuild instead
          # of spending ~1h rebuilding and overwriting it.
          docker run --rm \
            -e FROST_LINUX_RUN_FULL=1 \
            -e FROST_LINUX_PREBUILT=1 \
            -e COCOTB_NUM_RUNS=1 \
            -e COCOTB_LINUX_MAX_CYCLES=22000000 \
            -e COCOTB_PROGRESS_INTERVAL=500000 \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            bash -c '
              set -o pipefail
              cd tests && make clean
              # RUN_FULL runs to the max-cycle timeout assertion by design (its
              # marker never matches); the checker below supplies the verdict.
              ./test_run_cocotb.py linux_boot 2>&1 \
                | tee /workspace/linux_boot_cocotb.log || true
              python3 check_linux_boot_regression.py /workspace/linux_boot_cocotb.log
            '

      - name: Upload cocotb boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-boot-cocotb-log
          path: linux_boot_cocotb.log
          if-no-files-found: ignore

  # Boot the same artifact under QEMU as a fast independent reference. Require
  # the inittab stress payload (timers/signals, vfork/exec, futex, LR/SC) and
  # login prompt.
  linux-boot-qemu:
    name: QEMU Linux Boot (userspace stress + shell)
    runs-on: ubuntu-24.04
    needs: [build-docker, build-frost-linux]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Download FROST Linux boot images
        uses: actions/download-artifact@v4
        with:
          name: frost-linux-boot-images-rv64
          path: /tmp/frost-linux-images

      - name: Boot through userspace under QEMU (assert stress token + login prompt)
        run: |
          docker run --rm -v /tmp/frost-linux-images:/img frost-dev:latest \
            bash -c '
              set -euo pipefail
              # Time-box the persistent login prompt. Capture to a file because
              # piping QEMU stdout to grep deadlocks.
              timeout -k5 120 qemu-system-riscv64 -M virt -bios none \
                -kernel /img/Image \
                -append "earlycon=sbi console=ttyS0 rdinit=/sbin/init" \
                -initrd /img/rootfs.cpio.gz -nographic -cpu rv64,mmu=off \
                </dev/null >/tmp/qemu-boot.log 2>&1 || true
              echo "===== QEMU boot log (tail) ====="
              tail -n 20 /tmp/qemu-boot.log
              # Require stress completion before the getty and login prompt.
              grep -q "FROST_USERSPACE_STRESS_PASS" /tmp/qemu-boot.log
              grep -q "buildroot login:" /tmp/qemu-boot.log
            '

  # ---------------------------------------------------------------------------
  # MMU Linux lane (Phase 3): OpenSBI fw_jump + mainline Sv39 kernel + musl
  # userspace with perf. Built from the linux/opensbi and linux/buildroot
  # submodules through the FROST BR2_EXTERNAL tree; the images are packed by
  # frost_boot_image.py (firmware +0, Image +2 MiB, DTB +16 MiB, initramfs).
  build-frost-linux-mmu:
    name: Build FROST MMU Linux Image (Buildroot + OpenSBI)
    runs-on: ubuntu-24.04
    needs: build-docker
    timeout-minutes: 150
    env:
      BR2_DEFCONFIG_NAME: frost_rv64_defconfig
      BUILD_DIR: linux/build-mmu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Cache Buildroot downloads (source tarballs and the toolchain)
        uses: actions/cache@v4
        with:
          path: linux/dl
          key: br2-dl-mmu-${{ hashFiles('linux/buildroot-external/configs/**', 'linux/buildroot-external/board/frost/**') }}
          restore-keys: |
            br2-dl-mmu-
            br2-dl-

      - name: Cache Buildroot ccache (kernel and perf object cache)
        uses: actions/cache@v4
        with:
          path: linux/ccache
          key: br2-ccache-mmu-${{ github.sha }}
          restore-keys: |
            br2-ccache-mmu-

      - name: Build kernel + initramfs + firmware + FROST boot images
        run: |
          docker run --rm \
            -e BR2_DL_DIR=/workspace/linux/dl \
            -e BR2_CCACHE_DIR=/workspace/linux/ccache \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            bash -c '
              set -euo pipefail
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }} \
                BR2_EXTERNAL=/workspace/linux/buildroot-external \
                ${{ env.BR2_DEFCONFIG_NAME }}
              echo "BR2_CCACHE=y" >> /workspace/${{ env.BUILD_DIR }}/.config
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }} olddefconfig
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }}
              ls -l ${{ env.BUILD_DIR }}/images/
            '

      - name: Upload FROST MMU Linux boot images
        uses: actions/upload-artifact@v4
        with:
          name: frost-linux-boot-images-mmu
          path: |
            ${{ env.BUILD_DIR }}/images/Image
            ${{ env.BUILD_DIR }}/images/rootfs.cpio
            ${{ env.BUILD_DIR }}/images/fw_jump.bin
            ${{ env.BUILD_DIR }}/images/fw_jump.elf
            ${{ env.BUILD_DIR }}/images/frost.dtb
            ${{ env.BUILD_DIR }}/images/sw.mem
            ${{ env.BUILD_DIR }}/images/sw_ddr.mem
          retention-days: 7
          if-no-files-found: error

  # Boot the MMU images on the RTL with the X3 cache shape to a bounded
  # checkpoint: OpenSBI's banner (priv v1.12, sstc/svade), the kernel banner,
  # the SBI probes, the firmware's reserved-memory nodes, devtmpfs, no faults,
  # a re-armed stimecmp, and retire progress at the cap. The userspace token
  # is the QEMU job's and the hardware soak's evidence.
  linux-boot-cocotb-mmu:
    name: Cocotb MMU Linux Boot (X3 shape)
    runs-on: ubuntu-24.04
    needs: [build-docker, build-frost-linux-mmu]
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Download FROST MMU Linux boot images
        uses: actions/download-artifact@v4
        with:
          name: frost-linux-boot-images-mmu
          path: /tmp/frost-linux-images

      - name: Stage boot images for the cocotb linux_boot test
        run: |
          mkdir -p sw/apps/linux_boot
          cp /tmp/frost-linux-images/sw.mem     sw/apps/linux_boot/sw.mem
          cp /tmp/frost-linux-images/sw_ddr.mem sw/apps/linux_boot/sw_ddr.mem

      - name: Run cocotb linux_boot (MMU checkpoint)
        run: |
          docker run --rm \
            -e FROST_LINUX_RUN_FULL=1 \
            -e FROST_LINUX_PREBUILT=1 \
            -e COCOTB_NUM_RUNS=1 \
            -e COCOTB_LINUX_MAX_CYCLES=${{ env.LINUX_MMU_BOOT_CYCLES }} \
            -e COCOTB_PROGRESS_INTERVAL=500000 \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            bash -c '
              set -o pipefail
              cd tests && make clean
              ./test_run_cocotb.py linux_boot 2>&1 \
                | tee /workspace/linux_boot_mmu_cocotb.log || true
              python3 check_mmu_linux_boot.py /workspace/linux_boot_mmu_cocotb.log \
                --min-cycle ${{ env.LINUX_MMU_MIN_CYCLE }}
            '
        env:
          LINUX_MMU_BOOT_CYCLES: "30000000"
          LINUX_MMU_MIN_CYCLE: "29000000"

      - name: Upload cocotb boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-boot-mmu-cocotb-log
          path: linux_boot_mmu_cocotb.log
          if-no-files-found: ignore

  # Boot the same kernel and rootfs under QEMU twice: with QEMU's bundled
  # OpenSBI (an independent reference) and with the FROST-built fw_jump (the
  # firmware artifact on a second platform). Both must reach the stress token
  # and the login prompt.
  linux-boot-qemu-mmu:
    name: QEMU MMU Linux Boot (bundled and FROST OpenSBI)
    runs-on: ubuntu-24.04
    needs: [build-docker, build-frost-linux-mmu]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/frost-dev.tar

      - name: Download FROST MMU Linux boot images
        uses: actions/download-artifact@v4
        with:
          name: frost-linux-boot-images-mmu
          path: /tmp/frost-linux-images

      - name: Boot through userspace under QEMU with both firmwares
        run: |
          docker run --rm -v /tmp/frost-linux-images:/img frost-dev:latest \
            bash -c '
              set -euo pipefail
              boot() {
                timeout -k5 180 qemu-system-riscv64 -M virt -m 256M -nographic \
                  -cpu rv64,sv57=off,sv48=off,zicbom=false,zicboz=false,v=false,h=false \
                  -bios "$1" -kernel /img/Image -initrd /img/rootfs.cpio \
                  -append "earlycon console=ttyS0 rdinit=/sbin/init" \
                  </dev/null >"$2" 2>&1 || true
                echo "===== QEMU boot log ($1, tail) ====="
                tail -n 20 "$2"
                grep -q "FROST_USERSPACE_STRESS_PASS" "$2"
                grep -q "buildroot login:" "$2"
              }
              boot default /tmp/qemu-bundled.log
              boot /img/fw_jump.bin /tmp/qemu-frost-fw.log
            '
