name: CI

on:
  push:
    branches: [main]
  # A pull request starts no run by itself. Adding the run-ci label to it
  # starts one run on the pull request's merge commit; any other label starts
  # a run that skips every job but the selection. To run again after a later
  # push, remove the label and add it again, or start a manual run on the
  # branch.
  pull_request:
    branches: [main]
    types: [labeled]
  # A manual run can collect toggles, replay a vector slice, run the complete
  # vector campaign or run regular CI with optional fresh proofs.
  workflow_dispatch:
    inputs:
      reprove:
        description: Reprove formal and synthesis targets in regular CI
        type: boolean
        default: false
      toggle_coverage:
        description: Run only the toggle coverage shards, the image build and the coverage report
        type: boolean
        default: false
      slice:
        description: Run only one vector slice (0 to 19)
        type: string
        required: false
      campaign:
        description: Select complete to run only the vector campaign
        type: choice
        default: rotation
        options:
          - rotation
          - complete

# The workflow only reads source and publishes its own artifacts.
permissions:
  contents: read

# A run takes longer than the gap between pushes to main, so a newer push must
# not cancel it. On main, a started run finishes; the most recently queued run
# waits behind it, and GitHub keeps only one pending run per group, so a run
# still pending when another run is queued is cancelled in its favour. A pull
# request keeps one run: adding run-ci again cancels the run an earlier
# labelling started. The ASIC flow in asic.yml follows the same rule. Adding a
# label other than run-ci starts a run in a group of its own, so it does not
# cancel the pull request's run. Each manual vector replay or complete
# campaign has its own group so it can finish alongside a main run. Toggle
# coverage runs have a separate group per ref.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled' &&
    github.event.label.name != 'run-ci' && '-label' || '' }}${{
    github.event_name == 'workflow_dispatch' && inputs.toggle_coverage && '-toggle' || '' }}${{
    github.event_name == 'workflow_dispatch' && !inputs.toggle_coverage &&
    (inputs.campaign == 'complete' || inputs.slice != '')
    && format('-rvv-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with Dockerfile.
  VERILATOR_VERSION: "5.054"
  YOSYS_VERSION: "0.70"
  SBY_VERSION: "0.70"
  # Settings of the formal and synthesis jobs that reuse earlier passes
  # (tests/README.md#reusing-formal-and-synthesis-results). A push to main
  # whose head commit message contains [reprove], or a full manual CI
  # run with reprove set, proves everything again.
  FROST_REUSE_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.reprove) || contains(github.event.head_commit.message, '[reprove]') }}
  FROST_REUSE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
  FROST_REUSE_COMMIT: ${{ github.sha }}
  FROST_REUSE_REF: ${{ github.ref_name }}

jobs:
  # Toggle coverage and manual vector runs go directly to the shared image.
  # Regular CI runs on main, on demand or for the run-ci label.
  gate:
    name: Select jobs
    if: >-
      ${{ github.event_name != 'workflow_dispatch' ||
      (!inputs.toggle_coverage && inputs.campaign != 'complete' && inputs.slice == '') }}
    runs-on: ubuntu-26.04
    outputs:
      full: ${{ steps.select.outputs.full }}
      main_run: ${{ steps.count.outputs.main_run }}
      main_lifetime: ${{ steps.count.outputs.main_lifetime }}
      # False on a push to main whose count was not restored or could not be
      # kept: the formal and synthesis jobs then prove everything and read and
      # write no markers.
      reuse: >-
        ${{ github.event_name != 'push' || (
        steps.restore-count.outputs.cache-matched-key != '' &&
        steps.count.outcome == 'success' &&
        steps.check-count.outputs.cache-hit == 'true') }}
    steps:
      - name: Decide whether the full set of jobs runs
        id: select
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED: ${{ github.event.label.name }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            full=true
          elif [ "$ACTION" = labeled ] && [ "$ADDED" != run-ci ]; then
            full=false
          elif [ "$LABELED" = true ]; then
            full=true
          else
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

      # Pushes to main are counted in the Actions cache. A run on main
      # reuses only pass markers written in its own block of ten counts
      # (tests/README.md#reusing-formal-and-synthesis-results). A rerun of
      # the run keeps its count; a lost count starts again at 0. These steps
      # cannot fail the gate: a count that cannot be kept turns reuse off.
      - name: Restore the count of main runs
        continue-on-error: true
        id: restore-count
        if: github.event_name == 'push'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ci-main-runs
          key: main-run-count-${{ github.run_id }}
          restore-keys: main-run-count-

      - name: Count this main run
        continue-on-error: true
        id: count
        if: github.event_name == 'push'
        env:
          RERUN: ${{ steps.restore-count.outputs.cache-hit }}
        run: |
          # The file holds the count and its lifetime: the run that started
          # the count, which changes when a lost count starts again.
          read -r previous lifetime 2>/dev/null < .ci-main-runs/count || true
          case "$previous:$lifetime" in
            :* | *: | *[!0-9]*:* | *:*[!0-9]*) count=0 lifetime=$GITHUB_RUN_ID ;;
            *) if [ "$RERUN" = true ]; then count=$previous; else count=$((previous + 1)); fi ;;
          esac
          mkdir -p .ci-main-runs
          echo "$count $lifetime" > .ci-main-runs/count
          echo "main_run=$count" >> "$GITHUB_OUTPUT"
          echo "main_lifetime=$lifetime" >> "$GITHUB_OUTPUT"
          echo "Main run $count of the count started by run $lifetime"

      - name: Save the count of main runs
        continue-on-error: true
        if: github.event_name == 'push' && steps.restore-count.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .ci-main-runs
          key: main-run-count-${{ github.run_id }}

      # A count that was not saved would repeat in the next run.
      - name: Check that the count was saved
        id: check-count
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ci-main-runs
          key: main-run-count-${{ github.run_id }}
          lookup-only: true

  # Shared image for all jobs.
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-26.04
    needs: gate
    if: >-
      ${{ !cancelled() && (needs.gate.result == 'skipped' ||
      (needs.gate.result == 'success' &&
      needs.gate.outputs.full == 'true')) }}
    outputs:
      tools_id: ${{ steps.identity.outputs.tools_id }}
      verilator_matrix: ${{ steps.verilator.outputs.matrix }}
      rvv_matrix: ${{ steps.rvv.outputs.matrix }}
      sim_matrix: ${{ steps.models.outputs.sim_matrix }}
      sim_consumers: ${{ steps.models.outputs.sim_consumers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Select Cocotb jobs
        id: verilator
        if: ${{ needs.gate.outputs.full == 'true' || inputs.toggle_coverage }}
        env:
          TOGGLE_COVERAGE: ${{ inputs.toggle_coverage }}
        run: |
          matrix=$(python3 tests/ci_verilator.py)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Select generated vector shards
        id: rvv
        if: ${{ !inputs.toggle_coverage }}
        env:
          CAMPAIGN: ${{ inputs.campaign || 'rotation' }}
          SLICE: ${{ inputs.slice }}
          MAIN_RUN: ${{ needs.gate.outputs.main_run }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SLICES_PER_MAIN_RUN: "20"
        run: |
          number=${MAIN_RUN:-$GITHUB_RUN_NUMBER}
          slices=1
          case "$GITHUB_EVENT_NAME" in
            push) slices=$SLICES_PER_MAIN_RUN ;;
            pull_request) number=$PR_NUMBER ;;
          esac
          matrix=$(python3 tests/rvv_ci.py matrix \
            --run-number "$number" --slices-per-run "$slices" \
            --campaign "$CAMPAIGN" --slice "$SLICE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and export Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          tags: frost-dev:latest
          build-args: |
            VERILATOR_VERSION=${{ env.VERILATOR_VERSION }}
            YOSYS_VERSION=${{ env.YOSYS_VERSION }}
            SBY_VERSION=${{ env.SBY_VERSION }}
          outputs: type=docker,dest=/tmp/frost-dev.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest of the image's layers and environment. Layers restored
      # from the build cache keep their digests, so an unchanged image keeps
      # its identity; reuse keys include it.
      - name: Compute the image identity
        id: identity
        run: |
          echo "tools_id=$(python3 tests/ci_reuse.py image-id --archive /tmp/frost-dev.tar)" \
            >> "$GITHUB_OUTPUT"

      - name: Group the selected simulations by build configuration
        id: models
        env:
          FULL: ${{ needs.gate.outputs.full || 'false' }}
          TOGGLE: ${{ github.event_name == 'workflow_dispatch' && inputs.toggle_coverage && 'true' || 'false' }}
          EVENT: ${{ github.event_name }}
          VECTORS: ${{ steps.rvv.outputs.matrix }}
          FROST_SKIP_SUBMODULE_INIT: "1"
        run: |
          docker load --input /tmp/frost-dev.tar
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/ci_sim_plan.py --full "$FULL" --toggle "$TOGGLE" \
              --event "$EVENT" --vectors "$VECTORS" > sim-plan.txt
          cat sim-plan.txt >> "$GITHUB_OUTPUT"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frost-docker-image
          path: /tmp/frost-dev.tar
          retention-days: ${{ inputs.campaign == 'complete' && !inputs.toggle_coverage && 14 || 1 }}

  build-sim-models:
    name: Build simulator (${{ matrix.artifact }})
    needs: build-docker
    if: ${{ !cancelled() && needs.build-docker.result == 'success' && needs.build-docker.outputs.sim_matrix != '{}' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-docker.outputs.sim_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp
      - name: Build in the run's image
        env:
          MODELS: ${{ toJSON(matrix.models) }}
          FROST_DDR_MODEL_SEED: rvv-${{ github.run_id }}
          FROST_SKIP_SUBMODULE_INIT: "1"
          FROST_VERILATOR_THREADS: "1"
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar
          export FROST_SIM_SCOPE="$GITHUB_RUN_ID:$(docker image inspect frost-dev:latest --format '{{.Id}}')"
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/ci_sim_models.py build "$MODELS" sim-model-export
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: sim-model-export/
          if-no-files-found: error
          overwrite: true
          retention-days: ${{ inputs.campaign == 'complete' && !inputs.toggle_coverage && 14 || 3 }}

  # Run programs in both memory tiers; separate long runs and group matching builds.
  # CPU architecture comes from the shared RTL defaults used by FPGA builds.
  # Unit benches and DDR probes/fetch fuzz run only on the BRAM axis.
  test-verilator:
    name: Cocotb ${{ matrix.shard.name }} (Verilator / ${{ matrix.mem_config }})
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build-docker, build-sim-models]
    if: >-
      ${{ !cancelled() && needs.build-docker.result == 'success' &&
      needs.build-docker.outputs.verilator_matrix != '' }}
    # Real-program jobs allow four hours, including setup and coverage uploads,
    # unless the shard sets timeout_minutes. Allow 1.8 times the planned
    # wall time, rounded up within the applicable ceiling.
    timeout-minutes: ${{ matrix.shard.timeout_minutes || (startsWith(matrix.shard.name, 'Unit Tests') && 360 || 240) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-docker.outputs.verilator_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job][format('{0}/{1}', matrix.mem_config, matrix.shard.name)]) }}

      - name: Run Cocotb ${{ matrix.shard.name }} with Verilator (${{ matrix.mem_config }})
        env:
          FROST_COCOTB_MEM_CONFIG: ${{ matrix.mem_config }}
          FROST_REQUIRE_OPENOCD: "1"
          # Each job draws its own DDR model timing from this seed
          # (tests/README.md); a failing test's output names the draw, and a
          # rerun of the job repeats it.
          FROST_DDR_MODEL_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          FROST_STARTUP_SWEEP: ${{ !startsWith(matrix.shard.name, 'Unit Tests') && '1' || '0' }}
          FROST_STARTUP_SEED_BASE: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          FROST_RANDOM_START_SEED: ${{ !startsWith(matrix.shard.name, 'Unit Tests') && format('{0}-{1}-{2}', github.run_id, github.job, strategy.job-index) || '' }}
          # A shard's coverage field lists the memory tiers in which it
          # collects line and branch coverage and the cover points. The unit
          # benches also collect toggle coverage (tests/README.md#coverage).
          FROST_COVERAGE: ${{ contains(matrix.shard.coverage, matrix.mem_config) && '1' || '0' }}
          FROST_COVERAGE_TOGGLE: >-
            ${{ (startsWith(matrix.shard.name, 'Unit Tests') ||
              (github.event_name == 'workflow_dispatch' && inputs.toggle_coverage &&
              contains(matrix.shard.coverage, matrix.mem_config))) && '1' || '0' }}
          FROST_VERILATOR_THREADS: "1"
          # Allow 40 minutes for start-up seeds and controls across all
          # simulator builds in each toggle program job.
          FROST_STARTUP_TIMEOUT_SEC: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.toggle_coverage &&
              contains(matrix.shard.coverage, matrix.mem_config) &&
              !startsWith(matrix.shard.name, 'Unit Tests') && '2400' || '' }}
          # Optional per-cycle Python progress tracing adds host runtime to
          # these long workloads. Keep their checks and reset runs unchanged.
          COCOTB_COREMARK_PROGRESS_INTERVAL: ${{ contains(matrix.shard.name, 'CoreMark-PRO') && '0' || '500000' }}
          PYTEST_MARK: ${{ matrix.shard.pytest_mark }}
          PYTEST_FILTER: >-
            ${{ matrix.shard.pytest_filter_extra[matrix.mem_config] &&
                format('({0}) or ({1})', matrix.shard.pytest_filter, matrix.shard.pytest_filter_extra[matrix.mem_config]) ||
                matrix.shard.pytest_filter }}
          CALIBRATION_TEST: ${{ matrix.mem_config == 'bram' && matrix.shard.calibration_test || '' }}
        run: |
          if [ -n "$CALIBRATION_TEST" ]; then
            # FROST_CALIBRATION_TEST limits the capture to that test's runs.
            export FROST_CALIBRATION_TEST="$CALIBRATION_TEST"
            export FROST_CALIBRATION_TRACE_PATH="tests/calibration/$CALIBRATION_TEST.jsonl"
            export FROST_CALIBRATION_COUNTERS_PATH="tests/calibration/${CALIBRATION_TEST}_counters.json"
            export FROST_CALIBRATION_MANIFEST_PATH="tests/calibration/${CALIBRATION_TEST}_manifest.json"
            export FROST_GIT_COMMIT="$GITHUB_SHA"
          fi
          ./scripts/frost.py --image frost-dev:latest pytest \
            -m "$PYTEST_MARK" -k "$PYTEST_FILTER" -v --durations=0

      # Validate the calibration trace and compare it with the performance
      # model under perf-modeling/calibration/ci_baseline.json; the step prints
      # the deltas and fails beyond the baseline's tolerance.
      - name: Check the calibration trace against the performance model
        if: ${{ matrix.mem_config == 'bram' && matrix.shard.calibration_test }}
        env:
          CALIBRATION_TEST: ${{ matrix.shard.calibration_test }}
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 perf-modeling/tools/run_calibration.py \
            --trace "tests/calibration/$CALIBRATION_TEST.jsonl" \
            --counters "tests/calibration/${CALIBRATION_TEST}_counters.json" \
            --manifest "tests/calibration/${CALIBRATION_TEST}_manifest.json" \
            --baseline perf-modeling/calibration/ci_baseline.json \
            --rtl-commit "$GITHUB_SHA" \
            --out "tests/calibration/${CALIBRATION_TEST}_calibration.json"

      - name: Merge the job's coverage
        if: ${{ !cancelled() && contains(matrix.shard.coverage, matrix.mem_config) }}
        env:
          COVERAGE_NAME: cocotb ${{ matrix.shard.name }} ${{ matrix.mem_config }}
        run: |
          name=$(printf '%s' "$COVERAGE_NAME" | tr -cs 'A-Za-z0-9' '_')
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/coverage_report.py merge tests/coverage --output "coverage-job/$name.dat"

      - name: Upload the job's coverage
        if: ${{ !cancelled() && contains(matrix.shard.coverage, matrix.mem_config) }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-job-${{ github.job }}-${{ strategy.job-index }}
          path: coverage-job/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  # Exercise configured DDR apertures at their software-visible edges.
  test-pa-width:
    name: Physical address aperture (${{ matrix.capacity_gib }} GiB / ${{ matrix.shard.name }})
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build-docker, gate, build-sim-models]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' && needs.gate.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        capacity_gib: [1, 64, 128]
        shard:
          # A shard's coverage field lists the capacities at which it collects
          # coverage (tests/README.md#coverage).
          - name: Bare access
            programs: pa_width_test pma_fault_test
            coverage: [1]
          - name: Translation and fetch
            programs: pa_vm_fetch_test vm_test itlb_test
            coverage: []
          - name: DMA
            programs: pa_dma_test dma_torture
            coverage: [128]
          - name: NIC
            programs: pa_nic_mmio_test pa_nic_packet_test nic_loopback
            coverage: [128]
        include:
          - capacity_gib: 1
            shard:
              name: Unit boundaries
              coverage: [1]
              tests: >-
                line_port_axi_bridge_1g data_mem_request_router_1g dmmu_1g immu_1g
                tomasulo_wrapper_1g frost_cache frost_cache_dma dma_test_engine_wide_1g
          - capacity_gib: 64
            shard:
              name: Unit boundaries
              coverage: []
              tests: line_port_axi_bridge_wide frost_cache_wide_addr dma_test_engine_wide_64g
          - capacity_gib: 128
            shard:
              name: Unit boundaries
              coverage: []
              tests: line_port_axi_bridge_128g dma_test_engine_wide_128g
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job][format('{0}/{1}', matrix.capacity_gib, matrix.shard.name)]) }}

      - name: Run aperture checks
        env:
          PA_CAPACITY_GIB: ${{ matrix.capacity_gib }}
          PA_PROGRAMS: ${{ matrix.shard.programs }}
          PA_TESTS: ${{ matrix.shard.tests }}
          # Cover the hardware reset sweep with the job's randomized start.
          SIM_FAST_MAINT: ${{ matrix.capacity_gib == 1 && matrix.shard.name == 'Bare access' && '0' || '1' }}
          FROST_COVERAGE: ${{ contains(matrix.shard.coverage, matrix.capacity_gib) && '1' || '0' }}
          FROST_VERILATOR_THREADS: "1"
          FROST_DDR_MODEL_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          FROST_STARTUP_SWEEP: ${{ matrix.shard.name != 'Unit boundaries' && '1' || '0' }}
          FROST_STARTUP_SEED_BASE: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          FROST_RANDOM_START_SEED: ${{ matrix.shard.name != 'Unit boundaries' && format('{0}-{1}-{2}', github.run_id, github.job, strategy.job-index) || '' }}
        run: |
          tests="$PA_TESTS"
          for program in $PA_PROGRAMS; do
            case "${program}_${PA_CAPACITY_GIB}g" in
              # At the default 1 GiB aperture these are the programs that the
              # Real Programs jobs already run.
              pma_fault_test_1g|vm_test_1g|nic_loopback_1g) continue ;;
            esac
            tests="$tests ${program}_${PA_CAPACITY_GIB}g"
          done
          # One clean, then the runner reuses the Verilator build for each
          # test whose build signature matches the previous one.
          ./scripts/frost.py --image frost-dev:latest run bash -c \
            'cd tests && make clean && python3 random_start_sweep.py --plan "$@" && for test_name; do ./test_run_cocotb.py "$test_name" || exit 1; done' \
            _ $tests

      - name: Merge the job's coverage
        if: ${{ !cancelled() && contains(matrix.shard.coverage, matrix.capacity_gib) }}
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/coverage_report.py merge tests/coverage \
            --output coverage-job/pa-${{ strategy.job-index }}.dat

      - name: Upload the job's coverage
        if: ${{ !cancelled() && contains(matrix.shard.coverage, matrix.capacity_gib) }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-job-${{ github.job }}-${{ strategy.job-index }}
          path: coverage-job/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  # Standalone Ethernet uses the shared image but has no CPU/software dependencies.
  test-net10g:
    name: Ethernet MAC/PCS (cocotb and synthesis)
    runs-on: ubuntu-26.04
    needs: [build-docker, gate]
    if: ${{ needs.gate.outputs.full == 'true' }}
    timeout-minutes: 35
    env:
      FROST_SKIP_SUBMODULE_INIT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Run all standalone Ethernet simulations
        timeout-minutes: 15
        run: |
          mkdir -p tests/net10g/sim_build
          ./scripts/frost.py --image frost-dev:latest run python3 tests/net10g/run.py all \
            2>&1 | tee tests/net10g/sim_build/cocotb.log

      - name: Check portable Ethernet synthesis
        timeout-minutes: 15
        run: |
          ./scripts/frost.py --image frost-dev:latest run python3 tests/net10g/synthesize.py \
            2>&1 | tee tests/net10g/sim_build/synthesis.log

      - name: Upload Ethernet results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: net10g-results
          retention-days: 7
          if-no-files-found: ignore
          path: |
            tests/net10g/sim_build/*.log
            tests/net10g/sim_build/*/results.xml
            tests/net10g/sim_build/synthesis/*.log
            tests/net10g/sim_build/synthesis/sources.json
            tests/net10g/sim_build/synthesis/summary.json
            tests/net10g/sim_build/synthesis/synthesis.ys

  # Architecture tests: bram puts code, data, and signatures in low BRAM; ddr
  # puts them in cached DDR to exercise instruction and data caches. Each job
  # runs a group of extensions in one tier, at most about an hour of tests.
  # Local-only ``icache`` (code in DDR, data/signature in BRAM) isolates fetch;
  # it is diagnostic, not a compliance target.
  test-arch-compliance:
    name: Arch Tests (${{ matrix.extensions }} / ${{ matrix.mem_config }}${{ matrix.shard && format(' / {0}', matrix.shard) || '' }})
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout_minutes || 120 }}
    needs: [build-docker, gate, build-sim-models]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' && needs.gate.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Zcf is RV32-only; its C.FLW/C.FSW slots encode C.LD/C.SD on RV64.
        # Zifencei self-modifying code needs cached DDR. Low BRAM is Harvard:
        # ordinary CPU stores update only the data copy. F and D run only in
        # BRAM, split by --shard K/N. Only the first group collects coverage
        # (tests/README.md#coverage).
        include:
          - {extensions: I B C, mem_config: bram, coverage: 1, timeout_minutes: 123}
          - {extensions: M A K Zicond privilege D_Zcd hints CMO Zimop, mem_config: bram, coverage: 0}
          - {extensions: I M hints CMO Zimop, mem_config: ddr, coverage: 0}
          - {extensions: B C A K Zicond Zifencei privilege D_Zcd, mem_config: ddr, coverage: 0}
          - {extensions: F D, mem_config: bram, shard: 1/3, coverage: 0, timeout_minutes: 153}
          - {extensions: F D, mem_config: bram, shard: 2/3, coverage: 0, timeout_minutes: 139}
          - {extensions: F D, mem_config: bram, shard: 3/3, coverage: 0, timeout_minutes: 136}
          - {extensions: F_Zfa D_Zfa Zfh, mem_config: bram, coverage: 0}
          - {extensions: F_Zfa D_Zfa Zfh, mem_config: ddr, coverage: 0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job][strategy.job-index]) }}

      - name: Run arch compliance tests (${{ matrix.extensions }} / ${{ matrix.mem_config }}${{ matrix.shard && format(' / {0}', matrix.shard) || '' }})
        env:
          FROST_DDR_MODEL_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          FROST_RANDOM_START_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          # Line and branch coverage and the cover points (tests/README.md#coverage).
          FROST_COVERAGE: ${{ matrix.coverage }}
          FROST_VERILATOR_THREADS: "1"
          # Fail a hung test after 20 minutes, well before the job timeout.
          FROST_ARCH_SIM_TIMEOUT_SEC: "1200"
        run: |
          docker run --rm -e FROST_SIM_MODELS -e FROST_SIM_SCOPE -e FROST_DDR_MODEL_SEED -e FROST_RANDOM_START_SEED -e FROST_COVERAGE -e FROST_VERILATOR_THREADS -e FROST_ARCH_SIM_TIMEOUT_SEC \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_arch_compliance.py --extensions ${{ matrix.extensions }} \
              --mem-config ${{ matrix.mem_config }} \
              ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}

      - name: Merge the job's coverage
        if: ${{ !cancelled() && matrix.coverage == 1 }}
        env:
          COVERAGE_NAME: arch ${{ matrix.extensions }} ${{ matrix.mem_config }}
        run: |
          name=$(printf '%s' "$COVERAGE_NAME" | tr -cs 'A-Za-z0-9' '_')
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/coverage_report.py merge tests/coverage \
              --output "coverage-job/$name.dat"

      - name: Upload the job's coverage
        if: ${{ !cancelled() && matrix.coverage == 1 }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-job-${{ github.job }}-${{ strategy.job-index }}
          path: coverage-job/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  # riscv-tests: p runs physically without a kernel; v runs user suites on DDR
  # under env_v's Sv39 supervisor, with delegated page faults and Svade A/D handling.
  # Each job runs a group of suites on one Verilator build.
  test-riscv-tests:
    name: riscv-tests (${{ matrix.label || matrix.suites }} / ${{ matrix.mem_config }} / ${{ matrix.env }})
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build-docker, gate, build-sim-models]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' && needs.gate.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: all suites
            suites: rv64ui rv64um rv64ua rv64uc rv64uf rv64ud rv64uzba rv64uzbb rv64uzbc rv64uzbs rv64uzbkb rv64mi rv64si
            mem_config: bram
            env: p
            coverage: 1
          - label: all suites
            suites: rv64ui rv64um rv64ua rv64uc rv64uf rv64ud rv64uzba rv64uzbb rv64uzbc rv64uzbs rv64uzbkb rv64mi rv64si
            mem_config: ddr
            env: p
            coverage: 0
          - {suites: rv64ui rv64ud rv64uc, mem_config: ddr, env: v, coverage: 0}
          - {suites: rv64ua rv64uzbb, mem_config: ddr, env: v, coverage: 0}
          - {suites: rv64uf rv64um rv64uzbc rv64uzbs rv64uzba rv64uzbkb, mem_config: ddr, env: v, coverage: 0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job][strategy.job-index]) }}

      - name: Run riscv-tests ISA suites (${{ matrix.label || matrix.suites }} / ${{ matrix.mem_config }} / ${{ matrix.env }})
        env:
          FROST_DDR_MODEL_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          FROST_RANDOM_START_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          # Line and branch coverage and the cover points (tests/README.md#coverage).
          FROST_COVERAGE: ${{ matrix.coverage }}
          FROST_VERILATOR_THREADS: "1"
        run: |
          docker run --rm -e FROST_SIM_MODELS -e FROST_SIM_SCOPE -e FROST_DDR_MODEL_SEED -e FROST_RANDOM_START_SEED -e FROST_COVERAGE -e FROST_VERILATOR_THREADS \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_riscv_tests.py --suites ${{ matrix.suites }} \
              --mem-config ${{ matrix.mem_config }} --env ${{ matrix.env }}

      - name: Merge the job's coverage
        if: ${{ !cancelled() && matrix.coverage == 1 }}
        env:
          COVERAGE_NAME: riscv tests ${{ matrix.suites }} ${{ matrix.mem_config }} ${{ matrix.env }}
        run: |
          name=$(printf '%s' "$COVERAGE_NAME" | tr -cs 'A-Za-z0-9' '_')
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/coverage_report.py merge tests/coverage \
              --output "coverage-job/$name.dat"

      - name: Upload the job's coverage
        if: ${{ !cancelled() && matrix.coverage == 1 }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-job-${{ github.job }}-${{ strategy.job-index }}
          path: coverage-job/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  # riscv-tests benchmarks by memory tier, on one Verilator build per job; mm,
  # the longest, runs on its own. The job limits are 1.8 times the slowest
  # measured job, rounded up, and stay above the per-simulation limits in
  # tests/test_riscv_tests.py by the setup time.
  test-riscv-benchmarks:
    name: riscv-tests Benchmarks (${{ matrix.benchmarks }} / ${{ matrix.mem_config }})
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build-docker, gate, build-sim-models]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' && needs.gate.outputs.full == 'true' }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {benchmarks: median multiply qsort rsort towers vvadd dhrystone spmv, mem_config: bram, timeout_minutes: 70}
          - {benchmarks: median multiply qsort rsort towers vvadd dhrystone spmv, mem_config: ddr, timeout_minutes: 70}
          - {benchmarks: mm, mem_config: bram, timeout_minutes: 240}
          - {benchmarks: mm, mem_config: ddr, timeout_minutes: 240}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job][strategy.job-index]) }}

      - name: Run riscv-tests benchmarks (${{ matrix.benchmarks }} / ${{ matrix.mem_config }})
        env:
          FROST_DDR_MODEL_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          FROST_RANDOM_START_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          FROST_VERILATOR_THREADS: "1"
        run: |
          docker run --rm -e FROST_SIM_MODELS -e FROST_SIM_SCOPE -e FROST_DDR_MODEL_SEED -e FROST_RANDOM_START_SEED -e FROST_VERILATOR_THREADS \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_riscv_tests.py --benchmarks ${{ matrix.benchmarks }} \
              --mem-config ${{ matrix.mem_config }}

  # Compare RV64 torture with Spike in both tiers; the DDR-only paged run uses
  # an S-mode Sv39 identity map for all instruction and data accesses.
  test-riscv-torture:
    name: riscv-torture Tests (${{ matrix.mem_config }}${{ matrix.paged && ' / paged' || '' }})
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build-docker, gate, build-sim-models]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' && needs.gate.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mem_config: bram, paged: false, coverage: 0}
          - {mem_config: ddr, paged: false, coverage: 0}
          - {mem_config: ddr, paged: true, coverage: 1}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job][strategy.job-index]) }}

      - name: Run riscv-torture tests (${{ matrix.mem_config }}${{ matrix.paged && ' / paged' || '' }})
        env:
          FROST_DDR_MODEL_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          FROST_RANDOM_START_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          # Line and branch coverage and the cover points (tests/README.md#coverage).
          FROST_COVERAGE: ${{ matrix.coverage }}
          FROST_VERILATOR_THREADS: "1"
        run: |
          docker run --rm -e FROST_SIM_MODELS -e FROST_SIM_SCOPE -e FROST_DDR_MODEL_SEED -e FROST_RANDOM_START_SEED -e FROST_COVERAGE -e FROST_VERILATOR_THREADS \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/test_riscv_torture.py --all \
              --mem-config ${{ matrix.mem_config }} ${{ matrix.paged && '--paged' || '' }}

      - name: Merge the job's coverage
        if: ${{ !cancelled() && matrix.coverage == 1 }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace frost-dev:latest \
            python3 tests/coverage_report.py merge tests/coverage \
              --output coverage-job/riscv_torture_${{ matrix.mem_config }}${{ matrix.paged && '_paged' || '' }}.dat

      - name: Upload the job's coverage
        if: ${{ !cancelled() && matrix.coverage == 1 }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-job-${{ github.job }}-${{ strategy.job-index }}
          path: coverage-job/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  # TestRIG: QuickCheckVEngine runs instruction sequences on the Sail RISC-V
  # model and on the simulated SoC and compares every retired instruction
  # (tests/test_testrig.py). The first shard replays saved counterexamples,
  # scalar cryptography sequences, deterministic counter controls, and WFI traces.
  # Every shard then draws its own random sequences, 100 per template, from the
  # engine's templates, and its own random A-extension (verif/testrig/atomics.py),
  # Sv39 MMU (verif/testrig/mmu.py), CMO/Sstvala (verif/testrig/cmo.py), scalar
  # FP (verif/testrig/fp_ext.py), and Zcb/Zcmop/Zimop/Zihintntl
  # (verif/testrig/compressed_mops.py) sequences, whose seeds the log prints. A
  # mismatch is shrunk to a short counterexample in the uploaded artifact, which
  # --trace replays.
  test-testrig:
    name: TestRIG (FROST vs Sail / ${{ matrix.shard }}/4)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build-docker, gate, build-sim-models]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' && needs.gate.outputs.full == 'true' }}
    timeout-minutes: ${{ matrix.timeout_minutes || 120 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        include:
          - {shard: 1, coverage: 1, timeout_minutes: 132}
          - {shard: 2, coverage: 1}
          - {shard: 3, coverage: 0}
          - {shard: 4, coverage: 1}
    env:
      FROST_SKIP_SUBMODULE_INIT: "1"
      FROST_STARTUP_SWEEP: "1"
      FROST_STARTUP_SEED_BASE: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
      FROST_DDR_MODEL_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
      FROST_RANDOM_START_SEED: ${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
      # Line and branch coverage and the cover points (tests/README.md#coverage).
      FROST_COVERAGE: ${{ matrix.coverage }}
      FROST_VERILATOR_THREADS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job][matrix.shard]) }}

      - name: Replay saved TestRIG counterexamples and counter controls
        if: matrix.shard == 1
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --trace-dir verif/testrig/traces --continue-on-fail
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --crypto 50 --continue-on-fail
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --svinval 50 --continue-on-fail
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --sscofpmf

      - name: Compare FROST with Sail on random instruction sequences
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --tests 100 --continue-on-fail

      - name: Compare FROST with Sail on random A-extension sequences
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --atomics 200 --continue-on-fail

      - name: Compare FROST with Sail on random Sv39 MMU sequences
        if: ${{ !cancelled() }}
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --mmu 40 --continue-on-fail

      - name: Compare FROST with Sail on random CMO and Sstvala sequences
        if: ${{ !cancelled() }}
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --cmo 80 --continue-on-fail

      - name: Compare FROST with Sail on random scalar FP sequences
        if: ${{ !cancelled() }}
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --fp-ext 60 --test-length 250 \
              --continue-on-fail --log-dir tests/testrig_logs/fp-ext

      - name: Compare FROST with Sail on random Zcb, Zcmop, Zimop, and Zihintntl sequences
        if: ${{ !cancelled() }}
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --zcb 50 --test-length 200 \
              --continue-on-fail --log-dir tests/testrig_logs/zcb

      - name: Compare FROST with Sail on directed WFI traces
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          # The default TestRIG build supplies the shard's startup sweep.
          FROST_STARTUP_SWEEP: "0"
        run: |
          ./scripts/frost.py --image frost-dev:latest run make -C tests clean
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_testrig.py --wfi --log-dir tests/testrig_logs/wfi-run

      - name: Require startup assertion controls
        if: ${{ always() && matrix.shard == 3 }}
        run: |
          status=0
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/random_start_sweep.py --require-controls || status=$?
          cat tests/startup_sweep/control_summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload TestRIG counterexamples and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: testrig-results-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            tests/testrig_failures/
            tests/testrig_logs/

      - name: Merge the job's coverage
        if: ${{ !cancelled() && matrix.coverage == 1 }}
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/coverage_report.py merge tests/coverage \
              --output coverage-job/testrig_${{ matrix.shard }}.dat

      - name: Upload the job's coverage
        if: ${{ !cancelled() && matrix.coverage == 1 }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-job-${{ github.job }}-${{ strategy.job-index }}
          path: coverage-job/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  test-testrig-vector:
    name: TestRIG (FROST vs Sail / VLEN ${{ matrix.vlen }} / ${{ matrix.shard }})
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build-docker, gate, build-sim-models]
    if: >-
      ${{ !cancelled() && needs.build-docker.result == 'success' &&
      needs.gate.outputs.full == 'true' &&
      (github.event_name == 'push' || github.event_name == 'pull_request') }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        vlen: [128, 256, 512]
        shard: [core, segment, ext]
    env:
      FROST_SKIP_SUBMODULE_INIT: "1"
      FROST_DDR_MODEL_SEED: testrig-vector
      FROST_RANDOM_START_SEED: testrig-vector
      COCOTB_RANDOM_SEED: "42"
      FROST_VERILATOR_THREADS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job][format('{0}/{1}', matrix.vlen, matrix.shard)]) }}

      - name: Compare seeded and directed vector traces
        if: matrix.shard == 'core'
        run: |
          ./scripts/frost.py --image frost-dev:latest run make -C tests clean
          ./scripts/frost.py --image frost-dev:latest run \
            env NUMBER_OF_CPU_CORES=4 PYTHON_CPU_COUNT=4 timeout --kill-after=10s 55m \
            python3 tests/test_testrig.py --vector 12 --vector-length 20 \
              --vector-source-widths --vector-directed --seed 42 --vlen "${{ matrix.vlen }}" \
              --ddr-capacity-log2-bytes 30 --startup-timeout 1200 \
              --response-timeout 600 --no-shrink

      - name: Compare vector segment traces
        if: matrix.shard == 'segment'
        run: |
          ./scripts/frost.py --image frost-dev:latest run make -C tests clean
          ./scripts/frost.py --image frost-dev:latest run \
            env NUMBER_OF_CPU_CORES=4 PYTHON_CPU_COUNT=4 timeout --kill-after=10s 30m \
            python3 tests/test_testrig.py --vector-segments --vlen "${{ matrix.vlen }}" \
              --ddr-capacity-log2-bytes 30 --startup-timeout 1200 \
              --response-timeout 600 --no-shrink

      - name: Compare vector extension traces
        if: matrix.shard == 'ext'
        run: |
          ./scripts/frost.py --image frost-dev:latest run make -C tests clean
          ./scripts/frost.py --image frost-dev:latest run \
            env NUMBER_OF_CPU_CORES=4 PYTHON_CPU_COUNT=4 timeout --kill-after=10s 16m \
            python3 tests/test_testrig.py --vector-ext --vlen "${{ matrix.vlen }}" \
              --ddr-capacity-log2-bytes 30 --startup-timeout 1200 \
              --response-timeout 600 --no-shrink

      - name: Check detection of an incorrect vector result
        if: matrix.vlen == 128 && matrix.shard == 'core'
        timeout-minutes: 50
        run: |
          check_vector_result() {
            local selector=$1 trace=$2 record=$3 mismatch=$4
            local logs="tests/testrig_logs/vector-result-control/$trace" status=0
            FROST_TESTRIG_VECTOR_RESULT_CONTROL="$selector" \
              ./scripts/frost.py --image frost-dev:latest run \
              env NUMBER_OF_CPU_CORES=4 PYTHON_CPU_COUNT=4 timeout --kill-after=10s 600s \
              python3 tests/test_testrig.py --trace "verif/testrig/$trace.S" \
                --vlen 128 --ddr-capacity-log2-bytes 30 --startup-timeout 360 --response-timeout 180 \
                --no-shrink --verbosity 2 --log-dir "$logs" \
                --save-dir "tests/testrig_failures/vector-result-control/$trace" || status=$?
            test "$status" -eq 1
            test "$(grep -Fc 'Vector result control: ' "$logs/frost.log")" -eq 1
            grep -Fq "Vector result control: $record" "$logs/frost.log"
            grep -Fq 'TESTS=1 PASS=1 FAIL=0' "$logs/frost.log"
            grep -Fq "mismatch in field rd_wdata: $mismatch" "$logs/engine.log"
            echo "TestRIG reported the injected vector result mismatch in $trace."
          }

          check_vector_result 1 vector_source_widths_integer \
            'order=17 insn=0x43002557 rd=x10' '0x8 != 0x9'
          check_vector_result state vector_state_results \
            'order=52 insn=0x42182557 rd=x10' '0x3 != 0x2'
          check_vector_result fractional-lmul vector_fractional_lmul \
            'order=14 insn=0x42902557 rd=x10' '0x9 != 0x8'
          check_vector_result base-fp vector_fp_results_flags \
            'order=10 insn=0x43102557 rd=x10' '0x40400000 != 0x40400001'
          check_vector_result fma vector_fma \
            'order=14 insn=0x43602557 rd=x10' '0xffffffffa8800000 != 0xffffffffa8800001'
          check_vector_result fp-compare vector_fp_compare \
            'order=15 insn=0x43882557 rd=x10' '0x1 != 0x0'
          check_vector_result fp-convert vector_fp_convert \
            'order=9 insn=0x43802557 rd=x10' '0x3 != 0x2'
          check_vector_result unit-stride vector_unit_stride \
            'order=109 insn=0x43a02557 rd=x10' '0x12345678 != 0x12345679'
          check_vector_result int-compare vector_int_compare \
            'order=21 insn=0x43902557 rd=x10' '0x0 != 0x1'
          check_vector_result strided vector_strided \
            'order=158 insn=0x43b02557 rd=x10' '0x24681356 != 0x24681357'
          check_vector_result indexed vector_indexed \
            'order=217 insn=0x43c02557 rd=x10' '0x31415926 != 0x31415927'
          check_vector_result fof vector_fof \
            'order=29 insn=0x43f02557 rd=x10' '0x13572468 != 0x13572469'
          check_vector_result int-widen-narrow vector_int_widen_narrow \
            'order=72 insn=0x42e02557 rd=x10' '0x1fe != 0x1ff'
          check_vector_result fixed-point vector_fixed_point \
            'order=49 insn=0x42f02557 rd=x10' '0x7f != 0x7e'
          check_vector_result fp-single vector_fp_single \
            'order=30 insn=0x42d02557 rd=x10' '0x40100000 != 0x40100001'
          check_vector_result whole-reg vector_whole_reg \
            'order=45 insn=0x42c02557 rd=x10' '0x135724689acebdf1 != 0x135724689acebdf0'
          check_vector_result fp-widen vector_fp_widen \
            'order=22 insn=0x42a02557 rd=x10' '0x400e000000000000 != 0x400e000000000001'
          check_vector_result permutes vector_permutes \
            'order=23 insn=0x42b02557 rd=x10' '0x2468ace0 != 0x2468ace1'
          check_vector_result reductions vector_reductions \
            'order=30 insn=0x43202557 rd=x10' '0x1234a00a != 0x1234a00b'
          check_vector_result carry-borrow vector_carry_borrow \
            'order=48 insn=0x43302557 rd=x10' '0x1234a00a != 0x1234a00b'
          check_vector_result mask-ops vector_mask_ops \
            'order=27 insn=0x43502557 rd=x10' '0xf884 != 0xf885'
          check_vector_result int-mul-add vector_int_mul_add \
            'order=52 insn=0x43702557 rd=x10' '0x10010010 != 0x10010011'
          check_vector_result int-vx-merge vector_int_vx_merge \
            'order=18 insn=0x43402557 rd=x10' '0x20020020 != 0x20020021'

      - name: Check detection of an incorrect segment result
        if: matrix.vlen == 128 && matrix.shard == 'segment'
        timeout-minutes: 15
        run: |
          check_segment_result() {
            local selector=$1 name=$2 record=$3 mismatch=$4
            shift 4
            local logs="tests/testrig_logs/vector-result-control/$name" status=0
            FROST_TESTRIG_VECTOR_RESULT_CONTROL="$selector" \
              ./scripts/frost.py --image frost-dev:latest run \
              env NUMBER_OF_CPU_CORES=4 PYTHON_CPU_COUNT=4 timeout --kill-after=10s 600s \
              python3 tests/test_testrig.py "$@" \
                --vlen 128 --ddr-capacity-log2-bytes 30 --startup-timeout 360 --response-timeout 180 \
                --no-shrink --verbosity 2 --log-dir "$logs" \
                --save-dir "tests/testrig_failures/vector-result-control/$name" || status=$?
            test "$status" -eq 1
            test "$(grep -Fc 'Vector result control: ' "$logs/frost.log")" -eq 1
            grep -Fq "Vector result control: $record" "$logs/frost.log"
            grep -Fq 'TESTS=1 PASS=1 FAIL=0' "$logs/frost.log"
            grep -Fq "mismatch in field rd_wdata: $mismatch" "$logs/engine.log"
            echo "TestRIG reported the injected vector result mismatch in $name."
          }

          check_segment_result segment vector_segment \
            'order=45 insn=0x43e02557 rd=x10' '0x19475b81 != 0x19475b80' \
            --trace verif/testrig/vector_segment.S
          check_segment_result segment-matrix vector_segments \
            'order=147 insn=0x43d02557 rd=x10' '0x42eadaac != 0x42eadaad' \
            --vector-segments

      - name: Check detection of an incorrect extension result
        if: matrix.vlen == 128 && matrix.shard == 'ext'
        timeout-minutes: 11
        run: |
          check_ext_result() {
            local selector=$1 trace=$2 record=$3 mismatch=$4
            local logs="tests/testrig_logs/vector-result-control/$trace" status=0
            FROST_TESTRIG_VECTOR_RESULT_CONTROL="$selector" \
              ./scripts/frost.py --image frost-dev:latest run \
              env NUMBER_OF_CPU_CORES=4 PYTHON_CPU_COUNT=4 timeout --kill-after=10s 600s \
              python3 tests/test_testrig.py --trace "verif/testrig/$trace.S" \
                --vlen 128 --ddr-capacity-log2-bytes 30 --startup-timeout 360 --response-timeout 180 \
                --no-shrink --verbosity 2 --log-dir "$logs" \
                --save-dir "tests/testrig_failures/vector-result-control/$trace" || status=$?
            test "$status" -eq 1
            test "$(grep -Fc 'Vector result control: ' "$logs/frost.log")" -eq 1
            grep -Fq "Vector result control: $record" "$logs/frost.log"
            grep -Fq 'TESTS=1 PASS=1 FAIL=0' "$logs/frost.log"
            grep -Fq "mismatch in field rd_wdata: $mismatch" "$logs/engine.log"
            echo "TestRIG reported the injected vector result mismatch in $trace."
          }

          check_ext_result zvfhmin vector_zvfhmin \
            'order=30 insn=0x42102557 rd=x10' '0x3e00 != 0x3e01'
          check_ext_result zvbb vector_zvbb \
            'order=24 insn=0x42202557 rd=x10' '0xfffffffff00a1030 != 0xfffffffff00a1031'
          check_ext_result zvbc-zvkned-zvkg vector_zvbc_zvkned_zvkg \
            'order=36 insn=0x42302557 rd=x10' '0x40a0789828c810f0 != 0x40a0789828c810f1'
          check_ext_result zvknhb vector_zvknhb \
            'order=56 insn=0x42402557 rd=x10' '0xffffffff84c9dd79 != 0xffffffff84c9dd78'
          check_ext_result zvfh-arith vector_zvfh_arith_fma \
            'order=25 insn=0x42502557 rd=x10' '0x4100 != 0x4101'
          check_ext_result zvfh-misc-red vector_zvfh_cmp_misc_red \
            'order=39 insn=0x42602557 rd=x10' '0x3e00 != 0x3e01'
          check_ext_result zvfh-widen vector_zvfh_widen \
            'order=26 insn=0x42702557 rd=x10' '0x40200000 != 0x40200001'
          check_ext_result zvfh-cvt vector_zvfh_cvt \
            'order=27 insn=0x42802557 rd=x10' '0x3c01 != 0x3c00'

      - name: Upload TestRIG counterexamples and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: testrig-vector-results-${{ matrix.vlen }}-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            tests/testrig_failures/
            tests/testrig_logs/

  # Merge the coverage that the simulating jobs uploaded into one report
  # (tests/README.md#coverage): the merged data, lcov line and branch coverage,
  # annotated sources, and a summary of the totals, the cover points with
  # their hit counts, and each module's coverage, also shown on the job page.
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-26.04
    needs:
      - build-docker
      - test-verilator
      - test-pa-width
      - test-arch-compliance
      - test-riscv-tests
      - test-riscv-torture
      - test-testrig
    # Check every coverage input even when some of the simulating jobs fail.
    if: >-
      ${{ !cancelled() && needs.build-docker.result == 'success' &&
      needs.build-docker.outputs.verilator_matrix != '' }}
    timeout-minutes: 30
    env:
      FROST_SKIP_SUBMODULE_INIT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      # The pattern leaves out coverage-report, which a rerun of this job
      # would otherwise merge into its own inputs.
      - name: Download the jobs' coverage
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-job-*
          path: coverage-jobs

      - name: Merge and report
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            make -C tests coverage-sources
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/coverage_report.py report coverage-jobs \
              --output-dir coverage-report --annotate --require-ci-artifacts \
              ${{ inputs.toggle_coverage && '--toggle-coverage' || '' }}

      - name: Publish the summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage-report/summary.md ]; then
            cat coverage-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  # Yosys synthesis. The Xilinx target runs in partitions
  # (test_xilinx_partition in tests/test_run_yosys.py), in two jobs of about
  # equal length. The first job runs the portable target and checks, including
  # frontend equivalence. A fast test checks that the jobs run each synthesis
  # test once. The portable target and Xilinx partitions can reuse pass
  # markers. The remaining checks run on every full CI run. Each Xilinx
  # partition has a two-hour limit. The matrix sets the limit for each shard.
  test-synthesis:
    name: Yosys Synthesis Check (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    needs: [build-docker, gate]
    if: ${{ needs.gate.outputs.full == 'true' }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: Generic and checks
            pytest_filter: not test_xilinx_partition
            timeout_minutes: 120
          - shard: Xilinx core, hart caches and NIC
            pytest_filter: >-
              test_xilinx_partition[core] or test_xilinx_partition[core_backend] or
              test_xilinx_partition[hart_cache] or test_xilinx_partition[nic_engine] or
              test_xilinx_partition[nic_mac]
            timeout_minutes: 180
          - shard: Xilinx top and cluster memory
            pytest_filter: >-
              test_xilinx_partition[top] or test_xilinx_partition[cluster_memory]
            timeout_minutes: 180
    env:
      FROST_SKIP_SUBMODULE_INIT: "1"
      FROST_YOSYS_XILINX_TIMEOUT_SEC: "7200"
      FROST_YOSYS_EQUIV_DIR: tests/sim_build/yosys-equiv
      FROST_REUSE_DIR: ${{ needs.gate.outputs.reuse == 'true' && '.ci-reuse' || '' }}
      FROST_REUSE_TOOLS_ID: ${{ needs.build-docker.outputs.tools_id }}
      FROST_REUSE_MAIN_RUN: ${{ needs.gate.outputs.main_run }}
      FROST_REUSE_MAIN_LIFETIME: ${{ needs.gate.outputs.main_lifetime }}
      FROST_REUSE_CANARY_SEED: ${{ needs.gate.outputs.main_run || github.run_number }}
      FROST_REUSE_REPORT: ci-reuse-report.jsonl
      PYTEST_FILTER: ${{ matrix.pytest_filter }}
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Name the job's marker cache
        id: cache-name
        run: |
          echo "prefix=synthesis-reuse-v1-$(printf '%s' "$SHARD" | tr -cs 'A-Za-z0-9' '_')-" \
            >> "$GITHUB_OUTPUT"

      - name: Restore the pass markers
        if: env.FROST_REUSE_DIR != ''
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ci-reuse
          key: ${{ steps.cache-name.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache-name.outputs.prefix }}

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar
          test "$(python3 tests/ci_reuse.py image-id --image frost-dev:latest)" = \
            "$FROST_REUSE_TOOLS_ID"

      - name: Run synthesis tests
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            pytest tests/ -m synthesis -k "$PYTEST_FILTER" -v --durations=0

      - name: Upload frontend equivalence logs
        if: ${{ always() && matrix.shard == 'Generic and checks' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: yosys-frontend-equivalence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            tests/sim_build/yosys-equiv/**/*.log
            tests/sim_build/yosys-equiv/**/*.ys
            tests/sim_build/yosys-equiv/**/*.tcl
            tests/sim_build/yosys-equiv/**/*.f
            tests/sim_build/yosys-equiv/**/*.instance.il
            tests/sim_build/yosys-equiv/**/*.module
            tests/sim_build/yosys-equiv/**/counterexample.json

      - name: Summarize synthesized and reused targets
        if: always()
        run: |
          python3 tests/ci_reuse.py summary --report "$FROST_REUSE_REPORT" \
            --title "Synthesis targets ($SHARD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the pass markers
        if: always() && env.FROST_REUSE_DIR != ''
        uses: actions/cache/save@v6.1.0
        with:
          path: .ci-reuse
          key: ${{ steps.cache-name.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

  # Use FROST's pinned Yosys directly, as local fast checks do. The matrix
  # performs full slang elaboration, with two additional RTLIL import checks.
  test-slang-frontend:
    name: SystemVerilog Front End (yosys-slang)
    runs-on: ubuntu-26.04
    needs: [build-docker, gate]
    if: ${{ needs.gate.outputs.full == 'true' }}
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Read the RTL with yosys-slang
        env:
          FROST_SKIP_SUBMODULE_INIT: "1"
        run: |
          ./scripts/frost.py --image frost-dev:latest run python3 tests/slang_frontend.py

  # The ordinary synthesis jobs check the 1 GiB default. Check the widest
  # supported PA width, 128 GiB, with the same RTL build setting.
  test-pa-synthesis-width:
    name: PA synthesis aperture (${{ matrix.capacity_log2_bytes }} log2 bytes)
    runs-on: ubuntu-26.04
    needs: [build-docker, gate]
    if: ${{ needs.gate.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        capacity_log2_bytes: [37]
    env:
      FROST_SKIP_SUBMODULE_INIT: "1"
      FROST_REUSE_DIR: ${{ needs.gate.outputs.reuse == 'true' && '.ci-reuse' || '' }}
      FROST_REUSE_TOOLS_ID: ${{ needs.build-docker.outputs.tools_id }}
      FROST_REUSE_MAIN_RUN: ${{ needs.gate.outputs.main_run }}
      FROST_REUSE_MAIN_LIFETIME: ${{ needs.gate.outputs.main_lifetime }}
      FROST_REUSE_CANARY_SEED: ${{ needs.gate.outputs.main_run || github.run_number }}
      FROST_REUSE_REPORT: ci-reuse-report.jsonl
      REUSE_CACHE: synthesis-reuse-v1-pa${{ matrix.capacity_log2_bytes }}-
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Restore the pass markers
        if: env.FROST_REUSE_DIR != ''
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ci-reuse
          key: ${{ env.REUSE_CACHE }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.REUSE_CACHE }}

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar
          test "$(python3 tests/ci_reuse.py image-id --image frost-dev:latest)" = \
            "$FROST_REUSE_TOOLS_ID"

      - name: Synthesize the selected PA-width endpoint
        env:
          FROST_DDR_CAPACITY_LOG2_BYTES: ${{ matrix.capacity_log2_bytes }}
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            pytest tests/test_run_yosys.py -k generic -q

      - name: Summarize synthesized and reused targets
        if: always()
        run: |
          python3 tests/ci_reuse.py summary --report "$FROST_REUSE_REPORT" \
            --title "Synthesis targets" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the pass markers
        if: always() && env.FROST_REUSE_DIR != ''
        uses: actions/cache/save@v6.1.0
        with:
          path: .ci-reuse
          key: ${{ env.REUSE_CACHE }}${{ github.run_id }}-${{ github.run_attempt }}

  # SymbiYosys formal verification.
  test-formal:
    name: Formal Verification (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    needs: [build-docker, gate]
    if: ${{ needs.gate.outputs.full == 'true' }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: CSR profiling on
            pytest_filter: >-
              (csr_file_bmc and not csr_file_bmc_perf_off) or
              (coherence_l1d and coh_l1d_local and prove) or
              (coherent_local_atomic and sc_cover)
            timeout_minutes: 124
          - shard: CSR profiling off
            pytest_filter: >-
              csr_file_bmc_perf_off or
              (coherent_local_atomic and (amo_bmc or reservation_prove))
            timeout_minutes: 120
          - shard: Reorder buffer
            pytest_filter: >-
              reorder_buffer_bmc or
              (coherent_local_atomic and sc_bmc)
            timeout_minutes: 125
          # The coherence home, prefetch requester at every request cap,
          # endpoints, coherent CPU interfaces and hart covers.
          - shard: Coherence
            pytest_filter: >-
              ((coherence_ or coherent_) and not
              (axi_coherent_bridge or coherence_l1d or coherence_store_boundary or
              coherence_store_home or coherence_link or coherent_local_atomic or coh_hart_maint_prove or
              coh_hart_maint_owned_prove or coherence_array_equiv or coherence_array_progress or
              coherence_store_bank or
              coh_array4_port_bmc or coherence_home_coh_home_ or _twin or (coh_read_select and xilinx))) or
              (coherent_local_atomic and amo_cover)
            timeout_minutes: 330
          # Home task limits total 334 minutes plus twenty minutes for image setup.
          - shard: Coherence home
            pytest_filter: coherence_home_coh_home_ and not fast
            timeout_minutes: 355
          # Direct-tag-launch home task limits total 145 minutes plus twenty
          # minutes for image setup.
          - shard: Coherence home fast
            pytest_filter: coherence_home_coh_home_ and fast
            timeout_minutes: 165
          - shard: Coherence store lookup banks
            pytest_filter: coherence_array_progress or coherence_store_bank
            timeout_minutes: 152
          # The coherent array's equivalence with its reference array: the
          # one-way, UltraRAM and hit-port tasks with the cover, and the
          # four-way tasks, each about an hour of BMC tasks.
          - shard: Coherence array equivalence
            pytest_filter: coherence_array_equiv and not coh_array_equiv4
            timeout_minutes: 133
          - shard: Coherence array equivalence four-way
            pytest_filter: coh_array_equiv4
            timeout_minutes: 150
          # Each bounded store-home schedule checks both watched-byte choices
          # at its full depth, with 15 minutes allowed for each case.
          - shard: Coherence store home
            pytest_filter: coherence_store_home and not coherence_store_home_link
            timeout_minutes: 240
          # The link proofs, and the store-home composition with one register
          # stage between the L1D and the home. The sibling BMC's two
          # watched-byte cases (15 minutes each) share a job with the cover;
          # the pressure BMC's two cases have their own job.
          - shard: Coherence links
            pytest_filter: >-
              coherence_link or
              (coherence_store_home_link and not coherence_store_home_link_bmc_pressure)
            timeout_minutes: 200
          - shard: Coherence links pressure
            pytest_filter: coherence_store_home_link_bmc_pressure
            timeout_minutes: 180
          # The single-endpoint control BMC has a three-hour allowance for
          # its 40 frames; image setup has another twenty minutes.
          - shard: Coherence L1D control
            pytest_filter: coh_l1d_bmc
            timeout_minutes: 200
          # The three-endpoint control BMC has a five-hour allowance.
          - shard: Coherence L1D multi-endpoint
            pytest_filter: coh_l1d_multi_bmc
            timeout_minutes: 349
          # Word variants share their representative's measured allowance:
          # 65 minutes each for one endpoint, 70 for three endpoints. The
          # sums use 79% and 85% of their respective job limits.
          - shard: Coherence L1D data single-endpoint
            pytest_filter: coh_l1d_data
            timeout_minutes: 330
          - shard: Coherence L1D data multi-endpoint
            pytest_filter: coh_l1d_multi_data
            timeout_minutes: 330
          # Payload, grant and four-way data tasks have 210 minutes of
          # allowances in total, leaving setup and solver headroom.
          - shard: Coherence L1D data stores and ways
            pytest_filter: coh_l1d_store_ or coh_l1d_ways_data
            timeout_minutes: 270
          # The L1D control BMCs and single-endpoint cover with cbo.zero writes,
          # and the matching full-line and withdrawn-put control BMCs, each run
          # in dedicated jobs sized from their task allowances.
          - shard: Coherence L1D zero control
            pytest_filter: coh_l1d_zero_bmc
            timeout_minutes: 200
          - shard: Coherence L1D zero multi-endpoint
            pytest_filter: coh_l1d_zero_multi_bmc
            timeout_minutes: 330
          - shard: Coherence L1D zero cover
            pytest_filter: coh_l1d_zero_cover
            timeout_minutes: 260
          - shard: Coherence L1D zero payload and stream
            pytest_filter: >-
              coh_l1d_zero_payload_bmc or coh_l1d_zero_lookahead_cover or
              coh_l1d_zero_stream_bmc
            timeout_minutes: 180
          # The two hinted zero stream BMCs that finish within an hour (the
          # original stream properties and the same-block twin rule) and the two
          # scheduled full-buffer zero covers: 140 minutes of allowances.
          - shard: Coherence L1D zero schedules
            pytest_filter: >-
              coh_l1d_zero_stream_hint_bmc or coh_l1d_zero_stream_line_bmc or
              coh_l1d_zero_progress_cover or coh_l1d_zero_request_cover
            timeout_minutes: 150
          # Upper-sector request exclusion with the store queue's hints free, by
          # holding endpoint: endpoints 0 and 2 share a job (127 minutes of
          # allowances); endpoint 1's case, split by the operation in
          # operation_q, has its own (60 minutes).
          - shard: Coherence L1D zero stream, hinted endpoints 0 and 2
            pytest_filter: >-
              coh_l1d_zero_stream_upper_ep0_bmc or coh_l1d_zero_stream_upper_ep2_bmc
            timeout_minutes: 137
          - shard: Coherence L1D zero stream, hinted endpoint 1
            pytest_filter: coh_l1d_zero_stream_upper_ep1_
            timeout_minutes: 75
          - shard: Coherence L1D full control
            pytest_filter: coh_l1d_full_bmc
            timeout_minutes: 200
          - shard: Coherence L1D full multi-endpoint
            pytest_filter: coh_l1d_full_multi_bmc
            timeout_minutes: 330
          - shard: Coherence L1D full payload
            pytest_filter: coh_l1d_full_payload_bmc
            timeout_minutes: 120
          # The two full-line covers and the withdrawn-put full-line cover:
          # 326 minutes of allowances.
          - shard: Coherence L1D full-line covers
            pytest_filter: >-
              coh_l1d_full_cover or coh_l1d_full_lookahead_cover or
              coh_l1d_withdraw_full_cover
            timeout_minutes: 340
          # The full-line hold and credit covers and the store buffer contract
          # check: 35 minutes of allowances.
          - shard: Coherence L1D full-line holds
            pytest_filter: coh_l1d_full_hold_cover or coh_l1d_buffer_contract_bmc
            timeout_minutes: 50
          # The same control and payload checks with absorbed puts withdrawn
          # (WITHDRAW_ABSORBED_W, as MEMORY_LINK_STAGES sets it): each control
          # BMC has a job of its own; both payload BMCs share a third.
          - shard: Coherence L1D withdrawn puts, full-line control
            pytest_filter: coh_l1d_withdraw_full_bmc
            timeout_minutes: 200
          - shard: Coherence L1D withdrawn puts, zero-line control
            pytest_filter: coh_l1d_withdraw_zero_bmc
            timeout_minutes: 200
          - shard: Coherence L1D withdrawn puts, payloads
            pytest_filter: coh_l1d_withdraw and payload
            timeout_minutes: 210
          # The scheduled real-array checks keep all 80 frames, with disjoint
          # property groups and no assumptions between them. Run them in
          # parallel so their combined work does not delay the bridges.
          - shard: Coherence L1D local data
            pytest_filter: coh_l1d_local_data_bmc
            timeout_minutes: 30
          - shard: Coherence L1D local holds
            pytest_filter: coh_l1d_local_hold_bmc
            timeout_minutes: 30
          - shard: Coherence L1D local control
            pytest_filter: coh_l1d_local_control_bmc
            timeout_minutes: 30
          # Keep the scripted stream's payload holds at the same depth as
          # its control assertions, in parallel with the hart job.
          - shard: Coherence L1D scripted holds
            pytest_filter: coh_l1d_stream_hold_bmc
            timeout_minutes: 75
          - shard: Coherence L1D no-store holds
            pytest_filter: coh_l1d_stream_free_nostore_hold_bmc
            timeout_minutes: 75
          # The remaining L1D covers, local and stream tasks, and AXI bridges.
          - shard: Coherence L1D and bridges
            pytest_filter: >-
              axi_coherent_bridge or
              (coherence_l1d and not (_twin or coh_l1d_stream_bmc or coh_l1d_stream_hold_bmc or coh_l1d_stream_free or
              coh_l1d_stream_outlier_prove or
              coh_l1d_bmc or coh_l1d_multi_bmc or coh_l1d_zero or coh_l1d_full or coh_l1d_data or
              coh_l1d_withdraw or coh_l1d_buffer_contract or
              coh_l1d_multi_data or coh_l1d_store_ or coh_l1d_ways_data or
              (coh_l1d_local and (prove or bmc))))
            timeout_minutes: 330
          # The four-record boundary BMC runs 114 frames with the hit path;
          # the intervening-load BMC keeps 140. Each has a job of its own.
          - shard: Store boundary four records
            pytest_filter: coherence_store_boundary_bmc_four
            timeout_minutes: 360
          - shard: Store boundary intervening load
            pytest_filter: coherence_store_boundary_bmc_intervening
            timeout_minutes: 350
          # The AMO flow BMCs have 55- and 80-minute allowances. The owner
          # and fatal checks and the AMO covers have a job of their own.
          - shard: Store boundary AMO flow
            pytest_filter: >-
              coherence_store_boundary and (bmc_amo_same or bmc_amo_other) and
              not (fatal or owner)
            timeout_minutes: 180
          # The AMO owner and fatal checks, their sticky proofs and the AMO
          # covers. With full-line stores they take up to about 2.3 times as
          # long as before, so they are sized from that.
          - shard: Store boundary AMO checks
            pytest_filter: >-
              coherence_store_boundary and amo and (fatal or owner or cover)
            timeout_minutes: 240
          # SC (a 100-minute allowance) and the load, old-order, four-record
          # cover and edge tasks. The job's limit leaves room for the whole
          # selection to run about 2.3 times as long as it did before
          # full-line stores, on a runner 1.8 times slower than a typical one.
          - shard: Store boundary
            pytest_filter: >-
              coherence_store_boundary and not
              (coherence_store_boundary_bmc_four or
              coherence_store_boundary_bmc_intervening or amo or probe)
            timeout_minutes: 330
          # Composed probe-launch and C2b store_ack boundary checks: other-sector
          # BMC (100 min) and cover (40 min) in one shard; same-sector BMCs
          # (60 + 40 min), cover (40 min) and mutation controls in a second shard.
          - shard: Store boundary probe launch other
            pytest_filter: coherence_store_boundary and probe and other
            timeout_minutes: 160
          - shard: Store boundary probe launch same
            pytest_filter: >-
              (coherence_store_boundary and probe and same) or test_probe_launch_mutations
            timeout_minutes: 180
          # The eight-endpoint L1D stream BMC with arbitrary inputs and
          # stores runs to depth 32, and the four-way hit-port array BMC,
          # about 50 minutes, shares its job.
          - shard: Coherence L1D free stream
            pytest_filter: coh_l1d_stream_free_bmc or coh_array4_port_bmc
            timeout_minutes: 330
          # The hart maintenance composition proof and its ownership lemmas
          # share a job with the scripted and store-free eight-endpoint L1D
          # stream BMCs and their independent unbounded payload proof.
          - shard: Hart maintenance
            pytest_filter: >-
              coh_hart_maint_prove or coh_hart_maint_owned_prove or
              coh_l1d_stream_bmc or coh_l1d_stream_free_nostore_bmc or
              coh_l1d_stream_outlier_prove
            timeout_minutes: 335
          # Compare hand-instantiated primitives with their portable forms. The
          # payload twin's operand group runs with the wrapper proofs. This job
          # runs the other twin tasks, the read select's primitive tasks, the
          # INT_RS copy proofs (rs_issue_tag_banks and rs_issue_tag_copies)
          # and the tagged predictor's table-copy proof (tage_copy_convergence).
          - shard: Primitive forms
            pytest_filter: >-
              (_twin and not rs_payload_twin_bmc_operands) or
              (coh_read_select and xilinx) or rs_issue_tag_ or tage_copy_convergence
            timeout_minutes: 148
          # The vector CSR state, the vector memory unit and the vtype tracker:
          # the vector CSR BMC takes forty to fifty minutes, the memory unit's
          # BMC has a 25-minute limit and the tracker's proofs take seconds;
          # new vector proofs join them.
          - shard: Vector
            pytest_filter: >-
              csr_file_vector or vec_lmul_legality or vec_vmu or vec_vtype_tracker
            timeout_minutes: 126
          # The line client link proofs, in two jobs: the zero-stage BMC, the
          # two-identity one-stage BMC and the cover take about an hour; the
          # four- and eight-identity BMCs about forty minutes.
          - shard: Line client links (zero and two)
            pytest_filter: line_link0_bmc or line_link1_bmc or line_link1_cover
            timeout_minutes: 98
          - shard: Line client links (four and eight)
            pytest_filter: line_link1_four_bmc or line_link1_eight_bmc
            timeout_minutes: 80
          # Page table walker, TLBs, instruction and data MMUs, and the
          # interrupt controllers.
          - shard: Memory management
            pytest_filter: >-
              (ptw or tlb or imsic or aplic or immu or dmmu) and not
              (coherence_ or coherent_ or _twin)
            timeout_minutes: 120
          # The load queue's own proofs: their SBY allowances (formal/
          # load_queue.sby) plus ten minutes of setup.
          - shard: Load queue
            pytest_filter: >-
              load_queue_ and not load_queue_amo and not
              (coherence_ or coherent_ or _twin)
            timeout_minutes: 135
          # The load queue's helper blocks, its AMO datapath and the range
          # holds at its address-update port.
          - shard: Load queue blocks
            pytest_filter: (load_queue_amo or lq_) and not (coherence_ or coherent_ or _twin)
            timeout_minutes: 77
          # Front-end branch-prediction, backing BTB, fetch-contract and
          # predictor-mutation proofs.
          - shard: Frontend and predictor
            pytest_filter: >-
              prediction_release or prediction_handoff or if_prediction_walk_past or
              fetch_shadow_capture or (backing_btb and not _twin) or
              predictor_fetch_contract or test_predictor_mutations
            timeout_minutes: 150
          # The longest remaining block proofs: the flash-valid cache bits, the
          # vector memory tracker, the issue and rename blocks, the payload
          # twin's operand comparisons and the home's seat logic.
          - shard: Block proofs
            pytest_filter: >-
              cache_flash_valid or vec_vmt or tomasulo_wrapper or reservation_station_bmc or
              reservation_station_cover or rs_mem_broadcast or
              rat_checkpoint_restore or home_seat_next_equiv or
              rs_payload_twin_bmc_operands
            timeout_minutes: 150
          # Scalar floating-point forward-wake, shim, engine-op and mutation
          # proofs alongside the vector memory head and store-queue hold proofs.
          - shard: Floating-point and vector memory
            pytest_filter: >-
              fp_forward_wake or test_fp_forward_wake_mutations or fp_launch_squash or
              fp_shim or fp_engine_op_class or vec_head_mmu or
              (vec_hold_rows and not lq_)
            timeout_minutes: 140
          # Allow 10 minutes for setup, 60 for the bounded check and 5 for cover.
          - shard: ROB retirement successor
            pytest_filter: rob_retire_successor
            timeout_minutes: 75
          # Small equivalence proofs and block proofs without a dedicated
          # shard use this job, including wfi_commit_guard prove and cover.
          - shard: Other tasks
            pytest_filter: >-
              not (csr_file_bmc or reorder_buffer_bmc or axi_coherent_bridge or
              coherence_ or coherent_ or _twin or csr_file_vector or
              vec_lmul_legality or vec_vmu or vec_vtype_tracker or line_client_link or ptw or
              tlb or imsic or aplic or immu or dmmu or load_queue or lq_ or rs_issue_tag_ or
              prediction_release or prediction_handoff or if_prediction_walk_past or
              fetch_shadow_capture or backing_btb or predictor_fetch_contract or
              test_predictor_mutations or cache_flash_valid or vec_vmt or tomasulo_wrapper or
              reservation_station_bmc or reservation_station_cover or rs_mem_broadcast or
              rat_checkpoint_restore or home_seat_next_equiv or
              fp_forward_wake or test_fp_forward_wake_mutations or fp_launch_squash or
              fp_shim or fp_engine_op_class or vec_head_mmu or vec_hold_rows or
              tage_copy_convergence or rob_retire_successor or test_probe_launch_mutations)
            timeout_minutes: 124
    # A task whose key has a pass marker is skipped; one in twenty of those
    # is proved again as a canary. The markers are cached per job: a main run
    # reads only main's cache, a pull request also its own.
    env:
      FROST_SKIP_SUBMODULE_INIT: "1"
      FROST_REUSE_DIR: ${{ needs.gate.outputs.reuse == 'true' && '.ci-reuse' || '' }}
      FROST_REUSE_TOOLS_ID: ${{ needs.build-docker.outputs.tools_id }}
      FROST_REUSE_MAIN_RUN: ${{ needs.gate.outputs.main_run }}
      FROST_REUSE_MAIN_LIFETIME: ${{ needs.gate.outputs.main_lifetime }}
      FROST_REUSE_CANARY_SEED: ${{ needs.gate.outputs.main_run || github.run_number }}
      FROST_REUSE_REPORT: ci-reuse-report.jsonl
      FROST_REUSE_HOST_KEYS: ci-reuse-host-keys.json
      PYTEST_FILTER: ${{ matrix.pytest_filter }}
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Name the job's marker cache
        id: cache-name
        run: |
          echo "prefix=formal-reuse-v1-$(printf '%s' "$SHARD" | tr -cs 'A-Za-z0-9' '_')-" \
            >> "$GITHUB_OUTPUT"

      - name: Restore the pass markers
        if: env.FROST_REUSE_DIR != ''
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ci-reuse
          key: ${{ steps.cache-name.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache-name.outputs.prefix }}

      # Without a download when the job's last selection is unchanged and
      # every selected task has a pass marker for its key.
      - name: Plan which tasks run
        id: plan
        run: |
          python3 tests/ci_reuse.py formal-plan --dir "$FROST_REUSE_DIR" \
            --expression "$PYTEST_FILTER" --report "$FROST_REUSE_REPORT" \
            --host-keys "$FROST_REUSE_HOST_KEYS"

      - name: Download Docker image
        if: steps.plan.outputs.need_image == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        if: steps.plan.outputs.need_image == 'true'
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar
          test "$(python3 tests/ci_reuse.py image-id --image frost-dev:latest)" = \
            "$FROST_REUSE_TOOLS_ID"

      - name: Record the selected tests
        if: steps.plan.outputs.need_image == 'true'
        run: |
          ./scripts/frost.py --image frost-dev:latest run pytest tests/test_run_formal.py \
            tests/test_pa_bridge_mutation.py tests/test_predictor_mutations.py tests/test_fp_forward_wake_mutations.py \
            tests/test_probe_launch_mutations.py \
            -m formal -k "$PYTEST_FILTER" --collect-only -q > ci-reuse-collected.txt \
            && status=0 || status=$?
          python3 tests/ci_reuse.py formal-record --dir "$FROST_REUSE_DIR" \
            --expression "$PYTEST_FILTER" --tools-id "$FROST_REUSE_TOOLS_ID" \
            --collected ci-reuse-collected.txt --collect-status "$status"

      - name: Run formal verification
        if: steps.plan.outputs.need_image == 'true'
        run: |
          ./scripts/frost.py --image frost-dev:latest run pytest tests/test_run_formal.py \
            tests/test_pa_bridge_mutation.py tests/test_predictor_mutations.py tests/test_fp_forward_wake_mutations.py \
            tests/test_probe_launch_mutations.py \
            -m formal -k "$PYTEST_FILTER" -v --durations=0

      - name: Summarize proved and reused tasks
        if: always()
        run: |
          python3 tests/ci_reuse.py summary --report "$FROST_REUSE_REPORT" \
            --title "Formal tasks ($SHARD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the pass markers
        if: always() && env.FROST_REUSE_DIR != '' && steps.plan.outputs.need_image == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .ci-reuse
          key: ${{ steps.cache-name.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

  # Run the pinned pre-commit environment in Docker.
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    needs: [build-docker, gate]
    if: ${{ needs.gate.outputs.full == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Fetch only submodules needed by clang-tidy includes; skip entrypoint
      # auto-init so lint does not fetch Buildroot.
      - name: Fetch the submodules clang-tidy lints against
        run: |
          git submodule update --init --recursive \
            sw/FreeRTOS-Kernel \
            sw/apps/coremark/coremark \
            sw/apps/coremark_pro/coremark-pro \
            sw/apps/riscv_tests/riscv-tests

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Run pre-commit hooks
        run: |
          docker run --rm -e FROST_SKIP_SUBMODULE_INIT=1 \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            pre-commit run --all-files

  # Python/tooling tests only. The runner UID/GID also tests non-root containers.
  test-python:
    name: Fast Python Tests
    runs-on: ubuntu-26.04
    needs: [build-docker, gate]
    if: ${{ needs.gate.outputs.full == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Run fast Python tests as the host user
        run: |
          # Keep the entrypoint to catch non-root path-permission regressions.
          docker run --rm --init --pull=never \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env FROST_SKIP_SUBMODULE_INIT=1 \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            frost-dev:latest \
            pytest tests \
              -m "not cocotb and not synthesis and not formal and not slow" -v

  # Compare live unseeded cocotb runs of BRAM and DDR hello_world and BRAM
  # CoreMark with the checked 4-thread portable static native runner on cycles,
  # ticks, and UART bytes, and verify demo/run_demo.sh.
  test-native:
    name: Native Simulator (hello_world and BRAM CoreMark)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build-docker, gate, build-sim-models]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' && needs.gate.outputs.full == 'true' }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Fetch CoreMark submodule
        run: |
          git submodule update --init --recursive sw/apps/coremark/coremark

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job]['live']) }}

      - name: Compare live cocotb hello_world and check native simulator
        env:
          FROST_SKIP_SUBMODULE_INIT: "1"
          FROST_VERILATOR_THREADS: "1"
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/test_native_sim.py --ci

  test-rvv:
    name: >-
      Generated vectors (${{ matrix.vlen }},
      ${{ matrix.mode }} ${{ matrix.part }})
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    needs: [build-docker, build-sim-models]
    if: ${{ !cancelled() && needs.build-docker.result == 'success' && !inputs.toggle_coverage }}
    timeout-minutes: ${{ matrix.job_minutes || 140 }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.build-docker.outputs.rvv_matrix) }}
    env:
      FROST_SKIP_SUBMODULE_INIT: "1"
      FROST_DDR_MODEL_SEED: rvv-${{ github.run_id }}
      NUMBER_OF_CPU_CORES: "4"
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
      - name: Fetch the ISA test environment
        timeout-minutes: 5
        run: |
          git submodule update --init --recursive \
            sw/apps/riscv_tests/riscv-tests
      - uses: actions/download-artifact@v8.0.2
        timeout-minutes: 15
        with:
          name: frost-docker-image
          path: /tmp
      - name: Load Docker image
        timeout-minutes: 5
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar
      - name: Fetch the simulators selected for this job
        uses: ./.github/actions/sim-models
        timeout-minutes: 5
        with:
          selection: ${{ toJSON(fromJSON(needs.build-docker.outputs.sim_consumers)[github.job][matrix.vlen]) }}
      - name: Run vector programs
        id: programs
        timeout-minutes: ${{ matrix.step_minutes || 100 }}
        env:
          VLEN: ${{ matrix.vlen }}
          MODE: ${{ matrix.mode }}
          PART: ${{ matrix.part }}
        run: |
          test -f .ci-sim-models/selection.json
          args=()
          if jq -e '.shared | length > 0' .ci-sim-models/selection.json >/dev/null; then
            args+=(--prebuilt-sim ".ci-sim-models/rvv-$VLEN/frost-native")
          fi
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/rvv_ci.py run "$VLEN" "$MODE" "$PART" "${args[@]}"
      - name: Summarize the shard
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.programs.outcome }}
        run: |
          mkdir -p rvv-results
          if [ "$OUTCOME" != success ]; then
            printf '\nVector step outcome: %s.\n' "$OUTCOME" >> rvv-results/summary.md
          fi
          cat rvv-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rvv-v${{ matrix.vlen }}-${{ strategy.job-index }}
          path: rvv-results/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  rvv-campaign-report:
    name: Complete vector campaign results
    runs-on: ubuntu-26.04
    needs: [build-docker, test-rvv]
    if: >-
      ${{ !cancelled() && needs.build-docker.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      !inputs.toggle_coverage && inputs.campaign == 'complete' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp
      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: rvv-v*
          path: rvv-shards
      - name: Verify and merge the complete selection
        env:
          FROST_SKIP_SUBMODULE_INIT: "1"
          FROST_DDR_MODEL_SEED: rvv-${{ github.run_id }}
          FROST_RVV_IMAGE_ID: ${{ needs.build-docker.outputs.tools_id }}
          FROST_RVV_RUN_URL: ${{ env.FROST_REUSE_RUN_URL }}
          SHARD_STATUS: ${{ needs.test-rvv.result }}
        run: |
          ./scripts/frost.py --image frost-dev:latest run \
            python3 tests/rvv_ci.py collect rvv-shards rvv-campaign \
              --shard-status "$SHARD_STATUS"
      - name: Summarize the campaign
        if: ${{ !cancelled() }}
        run: cat rvv-campaign/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: rvv-complete
          path: rvv-campaign/
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  # Build demo/Dockerfile as documented in README.md and run the quick
  # demonstration, the unfiltered two-program run (--raw), and a
  # single-application invocation.
  test-demo-image:
    name: Demo Docker Image (build and run)
    runs-on: ubuntu-26.04
    needs: [build-docker, gate]
    if: ${{ needs.gate.outputs.full == 'true' }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Fetch CoreMark submodule
        run: |
          git submodule update --init --recursive sw/apps/coremark/coremark

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar
          docker tag frost-dev:latest frost:latest

      - name: Build demo Docker image
        run: |
          docker build -f demo/Dockerfile -t frost-demo:local .

      - name: Run the quick demonstration, raw and single-application containers
        run: |
          set -euo pipefail
          # Every check stops the step by itself: no `&&` list, no bare negation.
          require() {
            if ! grep -Fq -- "$2" "$1"; then
              echo "Missing from $1: $2" >&2
              exit 1
            fi
          }
          forbid() {
            if grep -Fq -- "$2" "$1"; then
              echo "Unexpected in $1: $2" >&2
              exit 1
            fi
          }
          start=$(date +%s)
          docker run --rm frost-demo:local --quick 2>&1 | tee /tmp/frost-demo-quick.log
          echo "Quick demonstration: $(( $(date +%s) - start )) s"
          require /tmp/frost-demo-quick.log "clock cycles, checksum verified."
          require /tmp/frost-demo-quick.log "every CRC correct (validated by CoreMark)"
          require /tmp/frost-demo-quick.log "Both programs verified their own results."
          # The closing table counts CoreMark's timed loop, so its cycles are the
          # iteration's cycles CoreMark reports, and the table is labeled and sized.
          require /tmp/frost-demo-quick.log "What the core did"
          require /tmp/frost-demo-quick.log "Counted while rendering and inside CoreMark's timed loop"
          require /tmp/frost-demo-quick.log "reorder-buffer entries (of 32)"
          require /tmp/frost-demo-quick.log "clock cycles for this first iteration"
          iteration=$(sed -n -E 's/^ *([0-9,]+) clock cycles for this first iteration.*/\1/p' /tmp/frost-demo-quick.log)
          column=$(sed -n -E 's/^ *Clock cycles +[0-9,]+ +([0-9,]+) *$/\1/p' /tmp/frost-demo-quick.log)
          if [ -z "$iteration" ]; then
            echo "No iteration cycle count in the quick output" >&2
            exit 1
          fi
          if [ -z "$column" ]; then
            echo "No CoreMark cycle count in the closing table" >&2
            exit 1
          fi
          if [ "$iteration" != "$column" ]; then
            echo "Table says $column cycles, CoreMark says $iteration" >&2
            exit 1
          fi

          docker run --rm frost-demo:local --raw 2>&1 | tee /tmp/frost-demo-raw.log
          require /tmp/frost-demo-raw.log "Frost: Hello, world!"
          require /tmp/frost-demo-raw.log "seedcrc          : 0xe9f5"
          require /tmp/frost-demo-raw.log "[0]crclist       : 0xe714"
          require /tmp/frost-demo-raw.log "[0]crcmatrix     : 0x1fd7"
          require /tmp/frost-demo-raw.log "[0]crcstate      : 0x8e3a"
          require /tmp/frost-demo-raw.log "[0]crcfinal      : 0xe714"
          require /tmp/frost-demo-raw.log "Correct operation validated."
          require /tmp/frost-demo-raw.log "<<PASS>>"
          require /tmp/frost-demo-raw.log "RTL assertions   : enabled after reset"
          require /tmp/frost-demo-raw.log "Demonstration finished: hello_world and CoreMark completed on the FROST RTL."
          forbid /tmp/frost-demo-raw.log "<<FAIL>>"

          docker run --rm frost-demo:local --threads 1 --app hello_world 2>&1 | tee /tmp/frost-demo-single.log
          require /tmp/frost-demo-single.log "Simulator threads: 1"
          require /tmp/frost-demo-single.log "Frost: Hello, world!"
          require /tmp/frost-demo-single.log "to stop marker + 10,000 drain"
          require /tmp/frost-demo-single.log "RTL assertions   : enabled after reset"
          forbid /tmp/frost-demo-single.log "<<FAIL>>"

  # ---------------------------------------------------------------------------
  # Build OpenSBI and musl userspace through the FROST BR2_EXTERNAL tree.
  # The post-image hook supplies Debian's pinned kernel and NIC module via
  # linux/debian_kernel.py, then checks packing with frost_boot_image.py.
  # Upload the components for QEMU and board-specific repacking by load_software.py.
  build-frost-linux-mmu:
    name: Build FROST MMU Linux Image (Debian kernel + Buildroot userspace + OpenSBI)
    runs-on: ubuntu-26.04
    needs: [build-docker, gate]
    if: ${{ needs.gate.outputs.full == 'true' }}
    # Allow for cold toolchain and package downloads as well as compilation.
    timeout-minutes: 60
    env:
      BR2_DEFCONFIG_NAME: frost_rv64_defconfig
      BUILD_DIR: linux/build-mmu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      # Cache downloads and ccache entries, keeping OpenSBI output directories
      # and firmware outside the caches. The post-image hook builds firmware.
      - name: Cache Buildroot downloads (source tarballs and the toolchain)
        uses: actions/cache@v6.1.0
        with:
          path: linux/dl
          key: br2-dl-mmu-${{ hashFiles('linux/buildroot-external/configs/**', 'linux/buildroot-external/board/frost/**') }}
          restore-keys: |
            br2-dl-mmu-
            br2-dl-

      - name: Cache Buildroot ccache (host and target package objects)
        uses: actions/cache@v6.1.0
        with:
          path: linux/ccache
          key: br2-ccache-mmu-${{ hashFiles('Dockerfile', 'linux/buildroot-external/configs/**') }}-${{ github.sha }}
          restore-keys: |
            br2-ccache-mmu-${{ hashFiles('Dockerfile', 'linux/buildroot-external/configs/**') }}-

      # Invalidate the package cache when the pin changes.
      - name: Cache the Debian kernel packages
        uses: actions/cache@v6.1.0
        with:
          path: linux/debian-kernel/dl
          key: debian-kernel-dl-${{ hashFiles('linux/debian_kernel.py') }}
          restore-keys: |
            debian-kernel-dl-

      - name: Build initramfs + firmware + FROST boot images
        run: |
          docker run --rm \
            -e BR2_DL_DIR=/workspace/linux/dl \
            -e BR2_CCACHE_DIR=/workspace/linux/ccache \
            -v ${{ github.workspace }}:/workspace frost-dev:latest \
            bash -c '
              set -euo pipefail
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }} \
                BR2_EXTERNAL=/workspace/linux/buildroot-external \
                ${{ env.BR2_DEFCONFIG_NAME }}
              echo "BR2_CCACHE=y" >> /workspace/${{ env.BUILD_DIR }}/.config
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }} olddefconfig
              make -C linux/buildroot O=/workspace/${{ env.BUILD_DIR }}
              ls -l ${{ env.BUILD_DIR }}/images/
            '

      # QEMU must boot the same kernel and initramfs that the post-image hook packed.
      - name: Upload FROST MMU Linux boot images
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frost-linux-boot-images-mmu
          path: |
            ${{ env.BUILD_DIR }}/images/Image-debian
            ${{ env.BUILD_DIR }}/images/rootfs.cpio
            ${{ env.BUILD_DIR }}/images/rootfs-frost.cpio
            ${{ env.BUILD_DIR }}/images/fw_jump.bin
            ${{ env.BUILD_DIR }}/images/fw_jump.elf
            ${{ env.BUILD_DIR }}/images/frost.dtb
          retention-days: 7
          if-no-files-found: error

  # Boot with QEMU's bundled OpenSBI and FROST's fw_jump. Require login and both
  # module-load and stress tokens. The module loader checks the running kernel
  # against the pinned release before printing its token.
  linux-boot-qemu-mmu:
    name: QEMU MMU Linux Boot (bundled and FROST OpenSBI)
    runs-on: ubuntu-26.04
    needs: [build-docker, gate, build-frost-linux-mmu]
    if: ${{ needs.gate.outputs.full == 'true' }}
    timeout-minutes: 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/frost-dev.tar
          rm -f /tmp/frost-dev.tar

      - name: Download FROST MMU Linux boot images
        uses: actions/download-artifact@v8.0.2
        with:
          name: frost-linux-boot-images-mmu
          path: /tmp/frost-linux-images

      - name: Boot through userspace under QEMU with both firmwares
        run: |
          docker run --rm -v /tmp/frost-linux-images:/img frost-dev:latest \
            bash -c '
              set -euo pipefail
              # Report image contents if the binary checked by Dockerfile is missing.
              if ! command -v qemu-system-riscv64; then
                echo "qemu-system-riscv64 missing from this image"
                echo "PATH=$PATH"
                ls -l /usr/local/bin/qemu-system-* /usr/local/share/qemu/opensbi* 2>&1 || true
                exit 1
              fi
              # Keep -append equal to DEFAULT_BOOTARGS in frost_boot_image.py.
              boot() {
                local bios="$1" log="$2" memory="$3"
                timeout -k5 180 qemu-system-riscv64 -M virt -m "$memory" -nographic \
                  -cpu rv64,sv57=off,sv48=off,zicbom=false,zicboz=true,cboz_blocksize=64,v=false,h=false \
                  -bios "$bios" -kernel /img/Image-debian \
                  -initrd /img/rootfs-frost.cpio \
                  -append "earlycon console=ttyS0 rdinit=/sbin/init ipv6.disable=1" \
                  </dev/null >"$log" 2>&1 || true
                echo "===== QEMU boot log ($bios, $memory, tail) ====="
                tail -n 20 "$log"
                grep -q "FROST_NET10G_MODULE_PASS" "$log"
                grep -q "FROST_MEMERR_MODULE_PASS" "$log"
                grep -q "FROST_USERSPACE_STRESS_PASS" "$log"
                grep -q "buildroot login:" "$log"
              }
              boot default /tmp/qemu-bundled.log 256M
              boot /img/fw_jump.bin /tmp/qemu-frost-fw.log 256M
              # With 3 GiB from 0x80000000, the Linux Normal zone crosses 4 GiB.
              # NODE_DATA above that boundary proves the kernel used high PA.
              boot /img/fw_jump.bin /tmp/qemu-frost-fw-highmem.log 3G
              grep -Eq "NODE_DATA\\(0\\) allocated \\[mem 0x1[[:xdigit:]]{8,}-0x1[[:xdigit:]]{8,}\\]" \
                /tmp/qemu-frost-fw-highmem.log
            '
