# OpenOCD configuration for FROST on the Alveo X3 (Phase 3 M3). The card's FPGA
# TAP is reached through its on-board FT4232H channel A (0x0403:0x6011) -- the
# same cable Vivado's hw_server uses, so close hw_server first: one owner per
# cable. The RISC-V DTM sits behind USER3/USER4 (see openocd_bscan_common.cfg);
# the UltraScale+ IR is 6 bits. Verified on the board: examine, halt, register
# read, single-step and resume against a running kernel.
#   openocd -f fpga/debug/openocd_x3.cfg
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
# The card exposes two FT4232H bridges; select the JTAG one by serial when the
# default (first match) is wrong: export FROST_JTAG_SERIAL=<serial from lsusb>.
if {[info exists ::env(FROST_JTAG_SERIAL)]} {
    adapter serial $::env(FROST_JTAG_SERIAL)
}
# Minimal MPSSE layout: drive only TCK/TDI/TMS (ADBUS0/1/3), TDO (ADBUS2) in,
# TMS idle high. No reset/PROGRAM_B pin is driven.
ftdi layout_init 0x0008 0x000b
adapter speed 1000
transport select jtag

set _CHIPNAME frost
# The card's UltraScale+ FPGA TAP IDCODE (version nibble masked).
set _IDCODE 0x04ad5093
jtag newtap $_CHIPNAME fpga -irlen 6 -expected-id $_IDCODE -ignore-version
source [find fpga/debug/openocd_bscan_common.cfg]
