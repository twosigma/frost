# OpenOCD configuration for FROST on the Alveo X3 (XCUX35), Phase 3 M3. Use
# the JTAG adapter that reaches the card's FPGA TAP and adjust the adapter
# block for the cable in use. It is the same cable Vivado's hw_server uses, so
# close hw_server first: one owner per cable. The RISC-V DTM sits behind
# USER3/USER4 (see openocd_bscan_common.cfg); the UltraScale+ IR is 6 bits.
#   openocd -f fpga/debug/openocd_x3.cfg
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0088 0x008b
adapter speed 5000
transport select jtag

set _CHIPNAME frost
# XCUX35 IDCODE (mask the version nibble).
set _IDCODE 0x04b31093
jtag newtap $_CHIPNAME fpga -irlen 6 -expected-id $_IDCODE -ignore-version
source [find fpga/debug/openocd_bscan_common.cfg]
