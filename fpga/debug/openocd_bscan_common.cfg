# Common target configuration for the BSCAN-tunneled debug transport
# (Phase 3 M3). boards/xilinx_frost_subsystem.sv hangs the DTM's dtmcs and
# dmi registers off the FPGA's own TAP through two BSCANE2 USER chains, so
# the three DTM registers are reached through the FPGA's IDCODE and USER
# instructions instead of the standard 5-bit DTM codes:
#   IDCODE 0x09, USER3 (dtmcs) 0x22, USER4 (dmi) 0x23   (6-bit FPGA IR)
# Source this after an adapter/board file that created the FPGA tap as
# $_CHIPNAME.fpga and set $_IDCODE.
set _TARGETNAME $_CHIPNAME.fpga
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
riscv set_ir idcode 0x09
riscv set_ir dtmcs 0x22
riscv set_ir dmi 0x23
# Memory and registers go through the program buffer; this DM has no system-bus
# access. OpenOCD >=0.12 renamed the old `set_prefer_sba off` to `set_mem_access`.
if {[catch {riscv set_mem_access progbuf}]} {
    catch {riscv set_prefer_sba off}
}
