# OpenOCD configuration for the simulated FROST debug transport (Phase 3 M3).
#
# The cocotb bench (verif/cocotb_tests/debug/test_debug_openocd.py) serves
# OpenOCD's remote_bitbang protocol and toggles frost's generic JTAG TAP
# (5-bit IR, standard DTM instruction codes, IDCODE 0x1F057001). Set the
# port before sourcing this file:
#   openocd -c "set FROST_RBB_PORT 3335" -f fpga/debug/openocd_sim.cfg
if {![info exists FROST_RBB_PORT]} {
    set FROST_RBB_PORT 3335
}
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $FROST_RBB_PORT
# remote_bitbang has no clock; the bench paces the edges (4 core cycles each).
adapter speed 1000

transport select jtag
set _CHIPNAME frost
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x1F057001
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
# No system bus access on this debug module: memory goes through the program
# buffer (the default).
riscv set_prefer_sba off
# Keep the session quiet enough for the bench to parse the FROST_* lines.
gdb_port disabled
telnet_port disabled
tcl_port disabled
