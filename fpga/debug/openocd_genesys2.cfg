# OpenOCD configuration for FROST on the Digilent Genesys 2 (XC7K325T),
# Phase 3 M3. The board's on-board FTDI JTAG reaches the FPGA TAP. It is the
# same cable Vivado's hw_server uses, so close hw_server first: one owner per
# cable. The RISC-V DTM sits behind USER3/USER4 (see
# openocd_bscan_common.cfg).
#   openocd -f fpga/debug/openocd_genesys2.cfg
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
adapter speed 5000
transport select jtag

set _CHIPNAME frost
set _IDCODE 0x13651093
jtag newtap $_CHIPNAME fpga -irlen 6 -expected-id $_IDCODE
source [find fpga/debug/openocd_bscan_common.cfg]
